<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<script src="config.js"></script>

<style>
body{font-family:Arial;background:#eef2f7;text-align:center;margin:0;}
.container{max-width:420px;margin:auto;padding:15px;}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;}
button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;}
.start{background:#28a745;color:#fff;}
.back{background:#333;color:#fff;}
</style>
</head>

<body>
<div class="container">

<h2>📦 Pickup</h2>

<div class="card">
Today Pickup: <b id="count">0</b>
</div>

<div class="card">
<div id="reader"></div>
<button class="start" onclick="startScan()">Start</button>
<button onclick="stopScan()">Stop</button>
<div id="status">Ready...</div>
</div>

<button class="back" onclick="goHome()">⬅ Home</button>

</div>

<script>
let html5QrCode, step="order", order="";

function startScan(){
  html5QrCode=new Html5Qrcode("reader");

  html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:250},txt=>{
    if(step==="order"){
      order=txt;
      step="tracking";
      status.innerText="Scan Tracking...";
      return;
    }

    if(step==="tracking"){
      stopScan();
      send(order,txt);
    }
  });
}

function stopScan(){
  if(html5QrCode) html5QrCode.stop().catch(()=>{});
}

function send(o,t){
  status.innerText="Saving...";

  fetch(API.post,{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode:"pickup",order_id:o,tracking:t})
  })
  .then(r=>r.json())
  .then(()=>{
    status.innerText="Saved ✅";
    step="order";
    load();
  });
}

function load(){
  fetch(API.stats())
  .then(r=>r.json())
  .then(d=> count.innerText=d.todayPickup||0);
}

function goHome(){ location.href="index.html"; }

load(); setInterval(load,4000);
</script>
</body>
</html>
