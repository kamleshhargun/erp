<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

<script src="config.js"></script>

<style>
body{font-family:Arial;background:#eef2f7;margin:0;text-align:center;}
.container{max-width:420px;margin:auto;padding:15px;}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;}

input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  font-size:14px;
}

.start{background:#28a745;color:#fff;}
.stop{background:#dc3545;color:#fff;}
.back{background:#333;color:#fff;}

#status{margin-top:10px;font-weight:500;}
</style>

</head>

<body>

<div class="container">

<h2>📦 Pickup Scanner</h2>

<div class="card">
Today Pickup: <b id="count">0</b>
</div>

<div class="card">

<input id="orderInput" placeholder="Order ID">
<input id="trackingInput" placeholder="Tracking ID">

<div id="reader" style="margin-top:10px;"></div>

<button class="start" onclick="startScan()">▶ Start Scan</button> <button class="stop" onclick="stopScan()">⛔ Stop</button>

<div id="status">Ready to scan Order ID</div>

</div>

<button class="back" onclick="goHome()">⬅ Home</button>

</div>

<!-- 🔊 BEEP SOUND -->

<audio id="beep" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>

let html5QrCode;
let step = "order";
let order = "";
let lastScan = "";

// INIT
window.onload = () => {
  orderInput.focus(); // cursor direct
  loadStats();
};

// ================= SCAN =================
function startScan(){

  if(html5QrCode) return;

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    (text)=>{

      if(text === lastScan) return;
      lastScan = text;

      if(step === "order"){
        order = text;
        orderInput.value = text;

        step = "tracking";
        status.innerText = "Scan Tracking ID";
        trackingInput.focus();
        return;
      }

      if(step === "tracking"){
        trackingInput.value = text;
        stopScan();
        saveData(order, text);
      }

    }
  );
}

// ================= STOP =================
function stopScan(){
  if(html5QrCode){
    html5QrCode.stop().catch(()=>{});
    html5QrCode = null;
  }
}

// ================= SAVE =================
function saveData(orderId, trackingId){

  if(!orderId || !trackingId){
    status.innerText = "Missing data ❌";
    return;
  }

  status.innerText = "Saving to Sheet...";

  fetch(API.post,{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      mode:"pickup",
      order_id:orderId,
      tracking:trackingId
    })
  })
  .then(r=>r.json())
  .then(res=>{

    if(res.status === "success"){
      document.getElementById("beep").play();
      status.innerText = "Saved in Sheet ✅";
    }else{
      status.innerText = "Error ❌";
    }

    resetFlow();
    loadStats();

  })
  .catch(()=>{
    status.innerText = "Network Error ❌";
    resetFlow();
  });
}

// ================= RESET =================
function resetFlow(){
  step = "order";
  order = "";
  lastScan = "";

  orderInput.value = "";
  trackingInput.value = "";

  orderInput.focus();
  status.innerText = "Ready for next Order";
}

// ================= MANUAL =================
orderInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    order = this.value.trim();
    if(!order) return;

    step = "tracking";
    status.innerText = "Enter Tracking ID";
    trackingInput.focus();
  }
});

trackingInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    const tracking = this.value.trim();
    if(!tracking) return;

    saveData(order, tracking);
  }
});

// ================= STATS =================
function loadStats(){
  fetch(API.stats())
  .then(r=>r.json())
  .then(d=>{
    count.innerText = d.todayPickup || 0;
  });
}

// ================= NAV =================
function goHome(){
  location.href="index.html";
}

</script>

</body>
</html>
