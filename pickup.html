<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<script src="config.js"></script>

<style>
body{font-family:Arial;background:#eef2f7;margin:0;text-align:center;}
.container{max-width:420px;margin:auto;padding:15px;}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;}

input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  font-size:14px;
}

.start{background:#28a745;color:#fff;}
.stop{background:#dc3545;color:#fff;}
.back{background:#333;color:#fff;}

#status{margin-top:10px;font-weight:500;}
</style>

</head>

<body>

<div class="container">

<h2>📦 Pickup Scanner</h2>

<div class="card">
Today Pickup: <b id="count">0</b>
</div>

<div class="card">

<input id="orderInput" placeholder="Order ID">
<input id="trackingInput" placeholder="Tracking ID">

<div id="reader" style="margin-top:10px;"></div>

<button class="start" onclick="startScan()">▶ Start Scan</button>
<button class="stop" onclick="stopScan()">⛔ Stop</button>

<div id="status">Ready to scan Order ID</div>

</div>

<button class="back" onclick="goHome()">⬅ Home</button>

</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>

let html5QrCode;
let step = "order";
let order = "";
let lastScan = "";

// INIT
window.onload = () => {
  document.getElementById("orderInput").focus();
  loadStats();
};

// ================= SCAN =================
function startScan(){

  if(html5QrCode) return;

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    (text)=>{

      if(text === lastScan) return;
      lastScan = text;

      if(step === "order"){
        order = text;
        document.getElementById("orderInput").value = text;

        step = "tracking";
        document.getElementById("status").innerText = "Scan Tracking ID";
        document.getElementById("trackingInput").focus();
        return;
      }

      if(step === "tracking"){
        document.getElementById("trackingInput").value = text;
        stopScan();
        saveData(order, text);
      }

    }
  );
}

// ================= STOP =================
function stopScan(){
  if(html5QrCode){
    html5QrCode.stop().catch(()=>{});
    html5QrCode = null;
  }
}

// ================= SAVE (FINAL FIXED) =================
function saveData(orderId, trackingId){

  const statusEl = document.getElementById("status");

  if(!orderId || !trackingId){
    statusEl.innerText = "Missing data ❌";
    return;
  }

  statusEl.innerText = "Saving...";

  console.log("Sending:", orderId, trackingId);

  // 🔥 FINAL FIX
  fetch(API.pickup(orderId, trackingId))
  .then(res => res.json())
  .then(res => {

    console.log("RESPONSE:", res);

    if(res.status === "success"){
      document.getElementById("beep").play();
      statusEl.innerText = "Saved in Sheet ✅";
    }else{
      statusEl.innerText = "Error ❌";
    }

    resetFlow();
    loadStats();
  })
  .catch(err=>{
    console.error("ERROR:", err);
    statusEl.innerText = "Network / API Error ❌";
    resetFlow();
  });
}

// ================= RESET =================
function resetFlow(){
  step = "order";
  order = "";
  lastScan = "";

  document.getElementById("orderInput").value = "";
  document.getElementById("trackingInput").value = "";

  document.getElementById("orderInput").focus();
  document.getElementById("status").innerText = "Ready for next Order";
}

// ================= MANUAL =================
document.getElementById("orderInput").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    order = this.value.trim();
    if(!order) return;

    step = "tracking";
    document.getElementById("status").innerText = "Enter Tracking ID";
    document.getElementById("trackingInput").focus();
  }
});

document.getElementById("trackingInput").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    const tracking = this.value.trim();
    if(!tracking) return;

    saveData(order, tracking);
  }
});

// ================= STATS =================
function loadStats(){
  fetch(API.stats())
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("count").innerText = d.todayPickup || 0;
  })
  .catch(()=>{});
}

// ================= NAV =================
function goHome(){
  location.href="index.html";
}

</script>

</body>
</html>
