<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Scanner FINAL</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 20px;
}

.btn {
  padding: 14px 22px;
  margin: 10px;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

.pickup { background: green; }
.return { background: red; }
.reset { background: black; }

input {
  padding: 14px;
  width: 85%;
  margin-top: 12px;
  font-size: 16px;
}

#status {
  margin-top: 15px;
  font-weight: bold;
  font-size: 18px;
}
</style>
</head>

<body>

<h2>📦 Daily Scanner FINAL</h2>

<button class="btn pickup" onclick="start('pickup')">Pickup</button>
<button class="btn return" onclick="start('return')">Return</button>
<button class="btn reset" onclick="resetAll()">Reset</button>

<br><br>

<input id="orderInput" placeholder="Scan Order ID" style="display:none;">
<input id="trackingInput" placeholder="Scan Tracking ID" style="display:none;">

<div id="status">Ready</div>

<audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3"></audio>

<script>

const API = "https://script.google.com/macros/s/AKfycbzS_hbdRujRjoK0IN9pDUoZuVKegKlD4vsskOehLG3YZgV-NEVR2YmkVI0RXl-gfgRfdg/exec";

// ELEMENTS
const orderInput = document.getElementById("orderInput");
const trackingInput = document.getElementById("trackingInput");
const statusBox = document.getElementById("status");
const beep = document.getElementById("beepSound");

let mode = "";
let step = "order";
let timer;
let saving = false;

// START
function start(type){
  mode = type;
  step = "order";

  orderInput.style.display = "block";
  trackingInput.style.display = "block";

  orderInput.value = "";
  trackingInput.value = "";

  statusBox.innerText = type.toUpperCase() + " START";

  orderInput.focus();
}

// DETECT COMPLETE SCAN (ENTER + NO ENTER BOTH)
function detect(type){

  clearTimeout(timer);

  timer = setTimeout(()=>{

    if(type === "order" && orderInput.value.trim() !== ""){
      step = "tracking";
      trackingInput.focus();
      statusBox.innerText = "Scan Tracking";
    }

    if(type === "tracking" && trackingInput.value.trim() !== ""){
      saveData();
    }

  }, 250); // stable delay

}

// INPUT EVENTS
orderInput.addEventListener("input", ()=> detect("order"));
trackingInput.addEventListener("input", ()=> detect("tracking"));

// ENTER SUPPORT
orderInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") detect("order");
});

trackingInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") detect("tracking");
});

// SAVE
function saveData(){

  if(saving) return;
  saving = true;

  let order = orderInput.value.trim();
  let tracking = trackingInput.value.trim();

  if(!order || !tracking){
    statusBox.innerText = "❌ Missing Data";
    saving = false;
    return;
  }

  statusBox.innerText = "Saving...";

  fetch(API + "?mode=" + mode + "&order_id=" + order + "&tracking=" + tracking)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      statusBox.innerText = "✅ Saved";
      beep.currentTime = 0;
      beep.play();
    }
    else if(data.status === "duplicate"){
      statusBox.innerText = "⚠ Duplicate";
    }
    else{
      statusBox.innerText = "❌ Error";
    }

    // RESET FOR NEXT SCAN
    orderInput.value = "";
    trackingInput.value = "";
    orderInput.focus();
    saving = false;

  })
  .catch(()=>{
    statusBox.innerText = "❌ Network Error";
    saving = false;
  });

}

// RESET
function resetAll(){
  mode = "";
  step = "order";
  saving = false;

  orderInput.style.display = "none";
  trackingInput.style.display = "none";

  orderInput.value = "";
  trackingInput.value = "";

  statusBox.innerText = "Reset Done";
}

</script>

</body>
</html>
