<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<script src="config.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:linear-gradient(135deg,#eef2f7,#dfe9f3);
  text-align:center;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.start{background:#28a745;color:#fff;}
.stop{background:#dc3545;color:#fff;}
.manualBtn{background:#444;color:#fff;}

.toggle{
  display:flex;
  gap:10px;
}
.toggle div{
  flex:1;
  padding:10px;
  background:#ddd;
  border-radius:20px;
  cursor:pointer;
}
.active{
  background:#007bff;
  color:#fff;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

#reader video{ width:100%; }

.status{
  margin-top:10px;
  font-weight:bold;
}

#manualBox{ display:none; }
</style>
</head>

<body>

<div class="container">

<h2>📦 Scanner</h2>

<!-- MODE -->
<div class="toggle">
  <div id="pickupBtn" class="active" onclick="setMode('pickup')">Pickup</div>
  <div id="returnBtn" onclick="setMode('return')">Return</div>
</div>

<!-- SCANNER -->
<div class="card">
  <div id="reader"></div>

  <button class="start" onclick="startScan()">Start Scan</button>
  <button class="stop" onclick="stopScan()">Stop</button>
  <button class="manualBtn" onclick="toggleManual()">Manual Entry</button>

  <div class="status" id="status">Ready...</div>
</div>

<!-- MANUAL -->
<div class="card" id="manualBox">
  <h3 id="manualTitle">Manual Entry</h3>
  <input id="manualOrder" placeholder="Order ID">
  <input id="manualTracking" placeholder="Tracking ID">
  <button onclick="submitManual()">Submit</button>
</div>

</div>

<script>

// ===== GLOBAL =====
let html5QrCode;
let mode = "pickup";
let step = "order";

let orderId = "";
let trackingId = "";

const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

// ===== MODE =====
function setMode(m){
  mode = m;
  resetFlow();

  pickupBtn.classList.remove("active");
  returnBtn.classList.remove("active");

  if(m==="pickup") pickupBtn.classList.add("active");
  else returnBtn.classList.add("active");

  manualTitle.innerText = m.toUpperCase() + " Manual Entry";

  status.innerText = "Mode: " + m.toUpperCase();
}

// ===== MANUAL TOGGLE =====
function toggleManual(){
  manualBox.style.display =
    manualBox.style.display === "none" ? "block" : "none";
}

// ===== START =====
function startScan(){

  if(!html5QrCode){
    html5QrCode = new Html5Qrcode("reader");
  }

  html5QrCode.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    onScan
  );

  status.innerText = "Scan Order ID...";
}

// ===== STOP =====
function stopScan(){
  if(html5QrCode){
    html5QrCode.stop().catch(()=>{});
  }
}

// ===== SCAN =====
function onScan(text){

  beep.play();

  // ORDER
  if(step==="order"){
    orderId = text;
    step = "tracking";
    status.innerText = "Order: " + orderId + " ✅ | Scan Tracking...";
    return;
  }

  // TRACKING
  if(step==="tracking"){
    trackingId = text;
    stopScan();
    status.innerText = "Saving...";
    sendData(orderId, trackingId);
  }
}

// ===== SEND =====
function sendData(o, t){

  fetch(API.post,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      mode: mode,
      order_id: o,
      tracking: t
    })
  })
  .then(r=>r.json())
  .then(res=>{

    if(res.status==="success"){
      status.innerText = "Saved ✅";
      document.body.style.background="#d4edda";

      setTimeout(resetFlow,1000);
    }
    else{
      status.innerText = "Error ❌";
    }

  })
  .catch(()=>{
    status.innerText = "Network Error ❌";
  });
}

// ===== MANUAL SUBMIT =====
function submitManual(){

  let o = manualOrder.value.trim();
  let t = manualTracking.value.trim();

  if(!o || !t){
    alert("Enter both values");
    return;
  }

  status.innerText = "Saving...";
  sendData(o,t);
}

// ===== RESET =====
function resetFlow(){

  document.body.style.background="";

  step = "order";
  orderId = "";
  trackingId = "";

  manualOrder.value = "";
  manualTracking.value = "";

  status.innerText = "Scan Order ID...";

  stopScan();
  startScan();
}

</script>

</body>
</html>
