<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Daily Scanner Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;
}

.container{
  width:100%;
  max-width:450px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  padding:28px;
  box-shadow:0 10px 35px rgba(0,0,0,0.35);
}

.logo{
  font-size:48px;
  text-align:center;
  margin-bottom:10px;
}

h1{
  text-align:center;
  font-size:28px;
  margin-bottom:6px;
}

.sub{
  text-align:center;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:28px;
}

.btns{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

.btn{
  flex:1;
  border:none;
  padding:14px;
  border-radius:14px;
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:0.25s;
}

.btn:hover{
  transform:translateY(-2px);
}

.pickup{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.return{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

.reset{
  width:100%;
  margin-top:15px;
  background:linear-gradient(135deg,#111827,#374151);
}

.inputBox{
  margin-top:18px;
}

.label{
  margin-bottom:8px;
  display:block;
  color:#e2e8f0;
  font-size:14px;
}

input{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:16px;
  border:2px solid transparent;
  transition:0.2s;
}

input:focus{
  border-color:#38bdf8;
  background:rgba(255,255,255,0.15);
}

input::placeholder{
  color:#cbd5e1;
}

#status{
  margin-top:22px;
  padding:16px;
  border-radius:14px;
  text-align:center;
  font-weight:600;
  background:rgba(255,255,255,0.08);
  color:#fff;
  min-height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.modeBadge{
  text-align:center;
  margin-bottom:20px;
  font-weight:600;
  font-size:15px;
  color:#38bdf8;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#94a3b8;
}

.hidden{
  display:none;
}

/* ================= NEW STATS ================= */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:22px;
}

.card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:14px;
  text-align:center;
}

.cardTitle{
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:6px;
}

.cardValue{
  font-size:22px;
  font-weight:700;
  color:#fff;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">📦</div>

  <h1>Daily Scanner Pro</h1>

  <div class="sub">
    Manual + Barcode Scanner Support
  </div>

  <!-- ================= NEW STATS ================= -->

  <div class="stats">

    <div class="card">
      <div class="cardTitle">Today Pickup</div>
      <div class="cardValue" id="todayPickup">0</div>
    </div>

    <div class="card">
      <div class="cardTitle">Today Return</div>
      <div class="cardValue" id="todayReturn">0</div>
    </div>

    <div class="card">
      <div class="cardTitle">Yesterday Pickup</div>
      <div class="cardValue" id="yesterdayPickup">0</div>
    </div>

    <div class="card">
      <div class="cardTitle">Yesterday Return</div>
      <div class="cardValue" id="yesterdayReturn">0</div>
    </div>

    <div class="card">
      <div class="cardTitle">Total Pickup</div>
      <div class="cardValue" id="totalPickup">0</div>
    </div>

    <div class="card">
      <div class="cardTitle">Total Return</div>
      <div class="cardValue" id="totalReturn">0</div>
    </div>

  </div>

  <!-- ================= END STATS ================= -->

  <div class="btns">
    <button class="btn pickup" onclick="start('pickup')">
      Pickup
    </button>

    <button class="btn return" onclick="start('return')">
      Return
    </button>
  </div>

  <div id="modeText" class="modeBadge">
    Select Mode
  </div>

  <div class="inputBox">
    <label class="label">Order ID</label>

    <input
      type="text"
      id="orderInput"
      placeholder="Scan / Enter Order ID"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      inputmode="text"
    />
  </div>

  <div class="inputBox">
    <label class="label">Tracking ID</label>

    <input
      type="text"
      id="trackingInput"
      placeholder="Scan / Enter Tracking ID"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      inputmode="text"
    />
  </div>

  <button class="btn reset" onclick="resetAll()">
    Reset
  </button>

  <div id="status">
    Ready
  </div>

  <div class="footer">
    Scanner Ready • Auto Save Enabled
  </div>

</div>

<audio id="beep" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3"></audio>

<script>

// ================= API =================

const API =
"https://script.google.com/macros/s/AKfycbzS_hbdRujRjoK0IN9pDUoZuVKegKlD4vsskOehLG3YZgV-NEVR2YmkVI0RXl-gfgRfdg/exec";

// ================= ELEMENTS =================

const orderInput = document.getElementById("orderInput");
const trackingInput = document.getElementById("trackingInput");
const statusBox = document.getElementById("status");
const modeText = document.getElementById("modeText");
const beep = document.getElementById("beep");

// ================= STATS ELEMENTS =================

const todayPickup = document.getElementById("todayPickup");
const todayReturn = document.getElementById("todayReturn");
const yesterdayPickup = document.getElementById("yesterdayPickup");
const yesterdayReturn = document.getElementById("yesterdayReturn");
const totalPickup = document.getElementById("totalPickup");
const totalReturn = document.getElementById("totalReturn");

// ================= VARIABLES =================

let mode = "";

// ================= LOAD STATS =================

function loadStats(){

  fetch(API + "?stats=true")

  .then(res => res.json())

  .then(data => {

    todayPickup.innerHTML = data.todayPickup || 0;
    todayReturn.innerHTML = data.todayReturn || 0;

    yesterdayPickup.innerHTML = data.yesterdayPickup || 0;
    yesterdayReturn.innerHTML = data.yesterdayReturn || 0;

    totalPickup.innerHTML = data.totalPickup || 0;
    totalReturn.innerHTML = data.totalReturn || 0;

  })

  .catch(error => {
    console.log(error);
  });

}

// ================= START =================

function start(type){

  mode = type;

  modeText.innerHTML =
    type === "pickup"
    ? "🟢 PICKUP MODE ACTIVE"
    : "🔴 RETURN MODE ACTIVE";

  statusBox.innerHTML = "Scan Order ID";

  orderInput.value = "";
  trackingInput.value = "";

  orderInput.focus();
}

// ================= ORDER INPUT =================

orderInput.addEventListener("keydown", function(e){

  if(e.key === "Enter"){

    e.preventDefault();

    let value = orderInput.value;

    value = value.replace(/\r/g, "").replace(/\n/g, "");

    orderInput.value = value;

    if(!value){

      setStatus("❌ Please Scan Order ID", "#ef4444");
      return;
    }

    setStatus("✅ Order ID Captured", "#22c55e");

    setTimeout(()=>{
      trackingInput.focus();
    },100);
  }
});

// ================= TRACKING INPUT =================

trackingInput.addEventListener("keydown", function(e){

  if(e.key === "Enter"){

    e.preventDefault();

    let value = trackingInput.value;

    value = value.replace(/\r/g, "").replace(/\n/g, "");

    trackingInput.value = value;

    saveData();
  }
});

// ================= SAVE =================

function saveData(){

  let order = orderInput.value
    .replace(/\r/g, "")
    .replace(/\n/g, "");

  let tracking = trackingInput.value
    .replace(/\r/g, "")
    .replace(/\n/g, "");

  if(!mode){

    setStatus("❌ Select Pickup / Return Mode", "#ef4444");
    return;
  }

  if(!order || !tracking){

    setStatus("❌ Missing Data", "#ef4444");
    return;
  }

  setStatus("⏳ Saving Data...", "#f59e0b");

  const url =
    API +
    "?mode=" + encodeURIComponent(mode) +
    "&order_id=" + encodeURIComponent(order) +
    "&tracking=" + encodeURIComponent(tracking);

  fetch(url, {
    method:"GET"
  })

  .then(res => res.json())

  .then(data => {

    if(data.status === "success"){

      setStatus("✅ Saved Successfully", "#22c55e");

      beep.currentTime = 0;
      beep.play();

      // ================= REFRESH STATS =================
      loadStats();

      nextEntry();
    }

    else if(data.status === "duplicate"){

      setStatus("⚠ Already Saved", "#f59e0b");

      nextEntry();
    }

    else{

      setStatus("❌ Save Failed", "#ef4444");
    }

  })

  .catch(error => {

    console.log(error);

    setStatus("❌ Network Error", "#ef4444");
  });

}

// ================= NEXT ENTRY =================

function nextEntry(){

  orderInput.value = "";
  trackingInput.value = "";

  setTimeout(()=>{

    orderInput.focus();

  },150);
}

// ================= RESET =================

function resetAll(){

  mode = "";

  orderInput.value = "";
  trackingInput.value = "";

  modeText.innerHTML = "Select Mode";

  setStatus("🔄 Reset Complete", "#38bdf8");
}

// ================= STATUS =================

function setStatus(text,color){

  statusBox.innerHTML = text;
  statusBox.style.border = "1px solid " + color;
  statusBox.style.color = color;
}

// ================= INITIAL LOAD =================

loadStats();

</script>

</body>
</html>
