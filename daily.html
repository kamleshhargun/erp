<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Scanner Simple</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 20px;
}

.btn {
  padding: 14px 22px;
  margin: 10px;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

.pickup { background: green; }
.return { background: red; }
.reset { background: black; }

input {
  padding: 14px;
  width: 85%;
  margin-top: 12px;
  font-size: 16px;
}

#status {
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>📦 Scanner Simple (Manual + Scanner)</h2>

<button class="btn pickup" onclick="start('pickup')">Pickup</button>
<button class="btn return" onclick="start('return')">Return</button>
<button class="btn reset" onclick="resetAll()">Reset</button>

<br><br>

<input id="orderInput" placeholder="Scan / Enter Order ID" style="display:none;">
<input id="trackingInput" placeholder="Scan / Enter Tracking ID" style="display:none;">

<div id="status">Ready</div>

<audio id="beep" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3"></audio>

<script>

const API = "https://script.google.com/macros/s/AKfycbzS_hbdRujRjoK0IN9pDUoZuVKegKlD4vsskOehLG3YZgV-NEVR2YmkVI0RXl-gfgRfdg/exec";

const orderInput = document.getElementById("orderInput");
const trackingInput = document.getElementById("trackingInput");
const statusBox = document.getElementById("status");
const beep = document.getElementById("beep");

let mode = "";

// ===== START =====
function start(type){
  mode = type;

  orderInput.style.display = "block";
  trackingInput.style.display = "block";

  orderInput.value = "";
  trackingInput.value = "";

  statusBox.innerText = type.toUpperCase() + " START";

  orderInput.focus();
}

// ===== ORDER ENTER / SCAN =====
orderInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    if(!orderInput.value.trim()){
      statusBox.innerText = "❌ Enter Order ID";
      return;
    }

    trackingInput.focus();
    statusBox.innerText = "Scan Tracking";
  }
});

// ===== TRACKING ENTER / SCAN =====
trackingInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    saveData();
  }
});

// ===== SAVE =====
function saveData(){

  let order = orderInput.value.trim();
  let tracking = trackingInput.value.trim();

  if(!order || !tracking){
    statusBox.innerText = "❌ Missing Data";
    return;
  }

  statusBox.innerText = "Saving...";

  fetch(API + "?mode=" + mode + "&order_id=" + order + "&tracking=" + tracking)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      statusBox.innerText = "✅ Saved";
      beep.currentTime = 0;
      beep.play();
    }
    else if(data.status === "duplicate"){
      statusBox.innerText = "⚠ Already Saved";
    }
    else{
      statusBox.innerText = "❌ Error";
    }

    // NEXT ENTRY
    orderInput.value = "";
    trackingInput.value = "";
    orderInput.focus();

  })
  .catch(()=>{
    statusBox.innerText = "❌ Network Error";
  });

}

// ===== RESET =====
function resetAll(){
  mode = "";

  orderInput.style.display = "none";
  trackingInput.style.display = "none";

  orderInput.value = "";
  trackingInput.value = "";

  statusBox.innerText = "Reset Done";
}

</script>

</body>
</html>
