<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="config.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:#eef2f7;
  text-align:center;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

.toggle{
  display:flex;
  gap:10px;
}
.toggle div{
  flex:1;
  padding:12px;
  background:#ddd;
  border-radius:20px;
  cursor:pointer;
}
.active{
  background:#007bff;
  color:#fff;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.status{
  margin-top:15px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>📦 Manual Scanner</h2>

<div class="toggle">
  <div id="pickupBtn" class="active" onclick="setMode('pickup')">Pickup</div>
  <div id="returnBtn" onclick="setMode('return')">Return</div>
</div>

<div class="card">

<input id="orderInput" placeholder="Order ID" autofocus>
<input id="trackingInput" placeholder="Tracking ID">

<div id="status" class="status">Ready...</div>

</div>

</div>

<script>

let mode = "pickup";

// ===== MODE =====
function setMode(m){
  mode = m;

  pickupBtn.classList.remove("active");
  returnBtn.classList.remove("active");

  if(m==="pickup") pickupBtn.classList.add("active");
  else returnBtn.classList.add("active");

  updateStatus("Mode: " + m.toUpperCase());
  reset();
}

// ===== ENTER FLOW =====
orderInput.addEventListener("keypress", function(e){
  if(e.key==="Enter"){
    if(!orderInput.value.trim()){
      updateStatus("Enter Order ID ❌");
      return;
    }
    updateStatus("Order OK → Enter Tracking");
    trackingInput.focus();
  }
});

trackingInput.addEventListener("keypress", function(e){
  if(e.key==="Enter"){
    submitData();
  }
});

// ===== SAVE =====
function submitData(){

  let order = orderInput.value.trim();
  let tracking = trackingInput.value.trim();

  if(!order || !tracking){
    updateStatus("Missing data ❌");
    return;
  }

  updateStatus("Sending data...");

  console.log("Sending:", {
    mode,
    order_id: order,
    tracking
  });

  fetch(API.post,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      mode: mode,
      order_id: order,
      tracking: tracking
    })
  })
  .then(res=>{
    console.log("Raw response:", res);
    return res.json();
  })
  .then(data=>{

    console.log("Response JSON:", data);

    if(data.status==="success"){
      updateStatus("Saved ✅");

      setTimeout(()=>{
        reset();
        updateStatus("Ready for next...");
      },800);

    }else{
      updateStatus("Error: " + JSON.stringify(data));
    }

  })
  .catch(err=>{
    console.error(err);
    updateStatus("Network / CORS Error ❌");
  });
}

// ===== RESET =====
function reset(){
  orderInput.value="";
  trackingInput.value="";
  orderInput.focus();
}

// ===== STATUS =====
function updateStatus(msg){
  document.getElementById("status").innerText = msg;
}

</script>

</body>
</html>
