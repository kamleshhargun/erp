<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Scanner</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 20px;
}

h2 {
  margin-bottom: 20px;
}

.btn {
  padding: 14px 22px;
  margin: 10px;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

.pickup { background: #28a745; }
.return { background: #dc3545; }

input {
  padding: 14px;
  width: 85%;
  margin-top: 15px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

#status {
  margin-top: 20px;
  font-weight: bold;
  font-size: 18px;
}
</style>

</head>

<body>

<h2>📦 Daily Pickup / Return</h2>

<button class="btn pickup" onclick="startFlow('pickup')">Pickup</button>
<button class="btn return" onclick="startFlow('return')">Return</button>

<br><br>

<input type="text" id="orderInput" placeholder="Enter Order ID" style="display:none;">
<input type="text" id="trackingInput" placeholder="Enter Tracking ID" style="display:none;">

<div id="status">Ready</div>

<!-- 🔊 SOUND -->
<audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" preload="auto"></audio>

<script>

// 🔥 APNA WEB APP URL DAALO
const API_URL = "https://script.google.com/macros/s/AKfycbzYF1nx8L09QvI-FF5e92lzf2sK78s90JImo87vX9fXMqJ3e01HrDUIRFR4I_BkgHUlXA/exec";

let mode = "";
let orderId = "";

// ===== START FLOW =====
function startFlow(type){
  mode = type;
  orderId = "";

  document.getElementById("orderInput").style.display = "block";
  document.getElementById("trackingInput").style.display = "none";

  document.getElementById("orderInput").value = "";
  document.getElementById("trackingInput").value = "";

  document.getElementById("status").innerText = type.toUpperCase() + " → Enter Order ID";
  document.getElementById("orderInput").focus();
}

// ===== ORDER ENTER =====
document.getElementById("orderInput").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    orderId = this.value.trim();

    if(!orderId){
      alert("Enter Order ID");
      return;
    }

    document.getElementById("trackingInput").style.display = "block";
    document.getElementById("trackingInput").focus();

    document.getElementById("status").innerText = "Enter Tracking ID";
  }
});

// ===== TRACKING ENTER =====
document.getElementById("trackingInput").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    let tracking = this.value.trim();

    if(!tracking){
      alert("Enter Tracking ID");
      return;
    }

    saveData(orderId, tracking);
  }
});

// ===== SAVE DATA =====
function saveData(order, tracking){

  document.getElementById("status").innerText = "Saving...";

  fetch(API_URL + "?mode=" + mode + "&order_id=" + order + "&tracking=" + tracking)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      document.getElementById("status").innerText = "✅ Saved Successfully";
      playBeep(); // 🔊 SOUND
    }
    else if(data.status === "duplicate"){
      document.getElementById("status").innerText = "⚠ Already Saved";
    }
    else{
      document.getElementById("status").innerText = "❌ Error";
    }

    reset();

  })
  .catch(err=>{
    document.getElementById("status").innerText = "❌ Network Error";
  });

}

// ===== PLAY SOUND =====
function playBeep(){
  let sound = document.getElementById("beepSound");
  sound.currentTime = 0;
  sound.play();
}

// ===== RESET =====
function reset(){
  setTimeout(()=>{
    document.getElementById("orderInput").style.display = "none";
    document.getElementById("trackingInput").style.display = "none";
    document.getElementById("status").innerText = "Ready";
  },1500);
}

</script>

</body>
</html>
