<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Scanner PRO</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 20px;
}

h2 { margin-bottom: 20px; }

.btn {
  padding: 14px 22px;
  margin: 10px;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

.pickup { background: #28a745; }
.return { background: #dc3545; }
.reset { background: #333; }

input {
  padding: 14px;
  width: 85%;
  margin-top: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

#status {
  margin-top: 15px;
  font-weight: bold;
  font-size: 18px;
}
</style>
</head>

<body>

<h2>📦 Daily Scanner PRO</h2>

<button class="btn pickup" onclick="startFlow('pickup')">Pickup</button>
<button class="btn return" onclick="startFlow('return')">Return</button>
<button class="btn reset" onclick="resetAll()">Reset</button>

<br><br>

<input type="text" id="orderInput" placeholder="Scan / Enter Order ID" style="display:none;">
<input type="text" id="trackingInput" placeholder="Scan / Enter Tracking ID" style="display:none;">

<div id="status">Ready</div>

<audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3"></audio>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzS_hbdRujRjoK0IN9pDUoZuVKegKlD4vsskOehLG3YZgV-NEVR2YmkVI0RXl-gfgRfdg/exec";

let mode = "";
let orderId = "";

// ===== START =====
function startFlow(type){
  mode = type;

  orderInput.style.display = "block";
  trackingInput.style.display = "block";

  orderInput.value = "";
  trackingInput.value = "";

  status.innerText = type.toUpperCase() + " MODE ACTIVE";

  setTimeout(()=>orderInput.focus(),100);
}

// ===== AUTO FOCUS FIX (IMPORTANT FOR SCANNER) =====
document.addEventListener("click", ()=>{
  if(orderInput.style.display === "block" && !orderInput.value){
    orderInput.focus();
  }
});

// ===== ORDER SCAN =====
orderInput.addEventListener("input", function(){

  if(this.value.length > 3){ // scanner usually long value
    orderId = this.value.trim();
    trackingInput.focus();
  }

});

// ===== TRACKING SCAN =====
trackingInput.addEventListener("input", function(){

  if(this.value.length > 3){
    let tracking = this.value.trim();
    saveData(orderId, tracking);
  }

});

// ===== SAVE =====
function saveData(order, tracking){

  if(!order || !tracking){
    status.innerText = "❌ Missing Data";
    return;
  }

  status.innerText = "Saving...";

  fetch(API_URL + "?mode=" + mode + "&order_id=" + order + "&tracking=" + tracking)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      status.innerText = "✅ Saved";
      playBeep();
    }
    else if(data.status === "duplicate"){
      status.innerText = "⚠ Duplicate";
    }
    else{
      status.innerText = "❌ Error";
    }

    // 🔥 CONTINUOUS MODE
    orderInput.value = "";
    trackingInput.value = "";

    orderInput.focus();

  })
  .catch(()=>{
    status.innerText = "❌ Network Error";
  });

}

// ===== SOUND =====
function playBeep(){
  let sound = document.getElementById("beepSound");
  sound.currentTime = 0;
  sound.play();
}

// ===== RESET =====
function resetAll(){

  mode = "";
  orderId = "";

  orderInput.style.display = "none";
  trackingInput.style.display = "none";

  orderInput.value = "";
  trackingInput.value = "";

  status.innerText = "Reset Done";

}

</script>

</body>
</html>
