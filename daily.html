<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<script src="config.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:linear-gradient(135deg,#eef2f7,#dfe9f3);
  text-align:center;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.start{background:#28a745;color:#fff;}
.stop{background:#dc3545;color:#fff;}

.toggle{
  display:flex;
  gap:10px;
}
.toggle div{
  flex:1;
  padding:10px;
  background:#ddd;
  border-radius:20px;
  cursor:pointer;
}
.active{
  background:#007bff;
  color:#fff;
}

#reader video{ width:100%; }

.status{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>📦 Scanner</h2>

<!-- MODE -->
<div class="toggle">
  <div id="pickupBtn" class="active" onclick="setMode('pickup')">Pickup</div>
  <div id="returnBtn" onclick="setMode('return')">Return</div>
</div>

<!-- SCANNER -->
<div class="card">
  <div id="reader"></div>

  <button class="start" onclick="startScan()">Start Scan</button>
  <button class="stop" onclick="stopScan()">Stop</button>

  <div class="status" id="status">Ready...</div>
</div>

</div>

<script>

// ===== GLOBAL =====
let html5QrCode;
let mode = "pickup";
let step = "order";

let orderId = "";
let trackingId = "";

const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

// ===== MODE =====
function setMode(m){
  mode = m;
  step = "order";
  orderId = "";
  trackingId = "";

  pickupBtn.classList.remove("active");
  returnBtn.classList.remove("active");

  if(m==="pickup") pickupBtn.classList.add("active");
  else returnBtn.classList.add("active");

  status.innerText = "Mode: " + m.toUpperCase();
}

// ===== START =====
function startScan(){

  if(!html5QrCode){
    html5QrCode = new Html5Qrcode("reader");
  }

  html5QrCode.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    onScan
  );

  status.innerText = "Scan Order ID...";
}

// ===== STOP =====
function stopScan(){
  if(html5QrCode){
    html5QrCode.stop().catch(()=>{});
  }
}

// ===== SCAN LOGIC =====
function onScan(text){

  beep.play();

  // STEP 1 → ORDER
  if(step==="order"){
    orderId = text;
    step = "tracking";
    status.innerText = "Order: " + orderId + " ✅ | Scan Tracking...";
    return;
  }

  // STEP 2 → TRACKING
  if(step==="tracking"){
    trackingId = text;

    stopScan();

    status.innerText = "Saving...";
    sendData();
  }
}

// ===== SEND DATA =====
function sendData(){

  fetch(API.post,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      mode: mode,
      order_id: orderId,
      tracking: trackingId
    })
  })
  .then(r=>r.json())
  .then(res=>{

    if(res.status==="success"){
      status.innerText = "Saved ✅";

      document.body.style.background="#d4edda";

      setTimeout(resetFlow,1000);
    }
    else{
      status.innerText = "Error ❌";
    }

  })
  .catch(()=>{
    status.innerText = "Network Error ❌";
  });
}

// ===== RESET =====
function resetFlow(){

  document.body.style.background="";

  step = "order";
  orderId = "";
  trackingId = "";

  status.innerText = "Scan Next Order...";

  startScan();
}

</script>

</body>
</html>
