<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Scanner PRO</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 20px;
}

h2 { margin-bottom: 20px; }

.btn {
  padding: 14px 22px;
  margin: 10px;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

.pickup { background: #28a745; }
.return { background: #dc3545; }
.reset { background: #333; }

input {
  padding: 14px;
  width: 85%;
  margin-top: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

#status {
  margin-top: 15px;
  font-weight: bold;
  font-size: 18px;
}
</style>
</head>

<body>

<h2>📦 Daily Scanner PRO</h2>

<button class="btn pickup" onclick="startFlow('pickup')">Pickup</button>
<button class="btn return" onclick="startFlow('return')">Return</button>
<button class="btn reset" onclick="resetAll()">Reset</button>

<br><br>

<input type="text" id="orderInput" placeholder="Scan / Enter Order ID" style="display:none;">
<input type="text" id="trackingInput" placeholder="Scan / Enter Tracking ID" style="display:none;">

<div id="status">Ready</div>

<audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3"></audio>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzS_hbdRujRjoK0IN9pDUoZuVKegKlD4vsskOehLG3YZgV-NEVR2YmkVI0RXl-gfgRfdg/exec";

let mode = "";
let orderId = "";
let buffer = "";
let timer;
let isSaving = false; // 🔥 prevent double save

// ===== START =====
function startFlow(type){
  mode = type;
  orderId = "";
  buffer = "";
  isSaving = false;

  orderInput.style.display = "block";
  trackingInput.style.display = "block";

  orderInput.value = "";
  trackingInput.value = "";

  status.innerText = type.toUpperCase() + " MODE ACTIVE";

  orderInput.focus();
}

// ===== SCANNER INPUT CAPTURE =====
document.addEventListener("keydown", function(e){

  if(!mode || isSaving) return;

  // ignore special keys
  if(e.key.length > 1 && e.key !== "Enter") return;

  if(e.key === "Enter"){
    processScan(buffer);
    buffer = "";
    return;
  }

  buffer += e.key;

  clearTimeout(timer);
  timer = setTimeout(()=>{
    processScan(buffer);
    buffer = "";
  }, 100); // 🔥 wait for full scan

});

// ===== PROCESS SCAN =====
function processScan(text){

  if(!text) return;

  // STEP 1: ORDER
  if(!orderId){
    orderId = text;
    orderInput.value = text;
    status.innerText = "Order OK → Scan Tracking";
    return;
  }

  // STEP 2: TRACKING
  trackingInput.value = text;

  saveData(orderId, text);
}

// ===== SAVE =====
function saveData(order, tracking){

  if(isSaving) return;
  isSaving = true;

  status.innerText = "Saving...";

  fetch(API_URL + "?mode=" + mode + "&order_id=" + order + "&tracking=" + tracking)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      status.innerText = "✅ Saved";
      playBeep();
    }
    else if(data.status === "duplicate"){
      status.innerText = "⚠ Already Saved";
    }
    else{
      status.innerText = "❌ Error";
    }

    // 🔥 RESET FOR NEXT SCAN
    setTimeout(()=>{
      orderId = "";
      isSaving = false;

      orderInput.value = "";
      trackingInput.value = "";

      orderInput.focus();

    }, 300);

  })
  .catch(()=>{
    status.innerText = "❌ Network Error";
    isSaving = false;
  });

}

// ===== SOUND =====
function playBeep(){
  let sound = document.getElementById("beepSound");
  sound.currentTime = 0;
  sound.play();
}

// ===== RESET BUTTON =====
function resetAll(){
  mode = "";
  orderId = "";
  buffer = "";
  isSaving = false;

  orderInput.style.display = "none";
  trackingInput.style.display = "none";

  orderInput.value = "";
  trackingInput.value = "";

  status.innerText = "Reset Done";
}

</script>

</body>
</html>
