<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="config.js"></script>

<style>
body{
  font-family:'Segoe UI';
  background:linear-gradient(135deg,#eef2f7,#dfe9f3);
  text-align:center;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
}

.toggle{
  display:flex;
  gap:10px;
}
.toggle div{
  flex:1;
  padding:12px;
  background:#ddd;
  border-radius:25px;
  cursor:pointer;
  font-weight:bold;
}
.active{
  background:#007bff;
  color:#fff;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

.status{
  margin-top:15px;
  font-weight:bold;
}

.success{ color:green; }
.error{ color:red; }

</style>
</head>

<body>

<div class="container">

<h2>📦 Manual Scanner</h2>

<!-- MODE -->
<div class="toggle">
  <div id="pickupBtn" class="active" onclick="setMode('pickup')">Pickup</div>
  <div id="returnBtn" onclick="setMode('return')">Return</div>
</div>

<!-- INPUT -->
<div class="card">

<input id="orderInput" placeholder="Enter / Scan Order ID" autofocus>
<input id="trackingInput" placeholder="Enter / Scan Tracking ID">

<div class="status" id="status">Ready...</div>

</div>

</div>

<script>

let mode = "pickup";

// ===== MODE =====
function setMode(m){
  mode = m;

  pickupBtn.classList.remove("active");
  returnBtn.classList.remove("active");

  if(m==="pickup") pickupBtn.classList.add("active");
  else returnBtn.classList.add("active");

  status.innerText = "Mode: " + m.toUpperCase();

  reset();
}

// ===== ENTER FLOW =====

// ORDER → ENTER → TRACKING
orderInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    if(!orderInput.value.trim()) return;
    trackingInput.focus();
  }
});

// TRACKING → ENTER → SAVE
trackingInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    submitData();
  }
});

// ===== SAVE =====
function submitData(){

  let order = orderInput.value.trim();
  let tracking = trackingInput.value.trim();

  if(!order || !tracking){
    status.innerText = "Missing data ❌";
    status.className="status error";
    return;
  }

  status.innerText = "Saving...";
  status.className="status";

  fetch(API.post,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      mode: mode,
      order_id: order,
      tracking: tracking
    })
  })
  .then(r=>r.json())
  .then(res=>{

    if(res.status==="success"){
      status.innerText = "Saved ✅";
      status.className="status success";

      setTimeout(()=>{
        reset();
      },600);

    }else{
      status.innerText = "Error ❌";
      status.className="status error";
    }

  })
  .catch(()=>{
    status.innerText = "Network Error ❌";
    status.className="status error";
  });
}

// ===== RESET =====
function reset(){
  orderInput.value="";
  trackingInput.value="";
  orderInput.focus();
}

</script>

</body>
</html>
