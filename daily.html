<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Scanner</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f4f6f9;
  padding: 20px;
}

h2 {
  margin-bottom: 20px;
}

.btn {
  padding: 14px 22px;
  margin: 10px;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

.pickup { background: #28a745; }
.return { background: #dc3545; }

input {
  padding: 14px;
  width: 85%;
  margin-top: 15px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

#status {
  margin-top: 20px;
  font-weight: bold;
  font-size: 18px;
}
</style>

</head>

<body>

<h2>📦 Daily Pickup / Return</h2>

<button class="btn pickup" onclick="startFlow('pickup')">Pickup</button>
<button class="btn return" onclick="startFlow('return')">Return</button>

<br><br>

<input type="text" id="orderInput" placeholder="Enter Order ID" style="display:none;">
<input type="text" id="trackingInput" placeholder="Enter Tracking ID" style="display:none;">

<div id="status">Ready</div>

<!-- 🔊 SOUND -->
<audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" preload="auto"></audio>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzS_hbdRujRjoK0IN9pDUoZuVKegKlD4vsskOehLG3YZgV-NEVR2YmkVI0RXl-gfgRfdg/exec";

let mode = "";
let orderId = "";
let typingTimer;

// ===== START FLOW =====
function startFlow(type){
  mode = type;
  orderId = "";

  orderInput.style.display = "block";
  trackingInput.style.display = "none";

  orderInput.value = "";
  trackingInput.value = "";

  status.innerText = type.toUpperCase() + " → Scan / Enter Order ID";
  orderInput.focus();
}

// ===== AUTO DETECT INPUT =====
function handleInput(inputType){

  clearTimeout(typingTimer);

  typingTimer = setTimeout(()=>{

    if(inputType === "order"){
      orderId = orderInput.value.trim();

      if(!orderId) return;

      trackingInput.style.display = "block";
      trackingInput.focus();
      status.innerText = "Scan / Enter Tracking ID";
    }

    if(inputType === "tracking"){
      let tracking = trackingInput.value.trim();

      if(!tracking) return;

      saveData(orderId, tracking);
    }

  }, 300); // 🔥 scanner speed detect

}

// ===== EVENT LISTENERS =====
orderInput.addEventListener("input", ()=> handleInput("order"));
trackingInput.addEventListener("input", ()=> handleInput("tracking"));

// ===== ENTER SUPPORT (manual users ke liye) =====
orderInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    handleInput("order");
  }
});

trackingInput.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    handleInput("tracking");
  }
});

// ===== SAVE DATA =====
function saveData(order, tracking){

  status.innerText = "Saving...";

  fetch(API_URL + "?mode=" + mode + "&order_id=" + order + "&tracking=" + tracking)
  .then(res => res.json())
  .then(data => {

    if(data.status === "success"){
      status.innerText = "✅ Saved Successfully";
      playBeep();
    }
    else if(data.status === "duplicate"){
      status.innerText = "⚠ Already Saved";
    }
    else{
      status.innerText = "❌ Error";
    }

    reset();

  })
  .catch(()=>{
    status.innerText = "❌ Network Error";
  });

}

// ===== SOUND =====
function playBeep(){
  let sound = document.getElementById("beepSound");
  sound.currentTime = 0;
  sound.play();
}

// ===== RESET =====
function reset(){
  setTimeout(()=>{
    orderInput.style.display = "none";
    trackingInput.style.display = "none";
    status.innerText = "Ready";
  },1500);
}

</script>

</body>
</html>
