<div class="card shadow-sm">

    <div class="card-header">
        <h4 class="mb-0">
            📦 Order Tracking
        </h4>
    </div>

    <div class="card-body">

        <div class="row mb-4">

            <div class="col-md-10">

                <input
                    type="text"
                    id="trackAwb"
                    class="form-control form-control-lg"
                    placeholder="Enter AWB Number">

            </div>

            <div class="col-md-2">

                <button
                    class="btn btn-primary w-100 h-100"
                    onclick="searchTracking()">

                    Search

                </button>

            </div>

        </div>

        <!-- Status Summary -->

        <div class="row g-3 mb-4">

            <div class="col-md-2">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <div>Manifest</div>
                        <h3 id="manifestCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-2">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <div>Transit</div>
                        <h3 id="transitCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-2">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <div>OFD</div>
                        <h3 id="ofdCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-2">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <div>Delivered</div>
                        <h3 id="deliveredCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-2">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <div>RTO</div>
                        <h3 id="rtoCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-2">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <div>NDR</div>
                        <h3 id="ndrCount">0</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- Tracking Details -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                Tracking Details
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3">
                        <b>AWB</b>
                        <div id="showAwb">-</div>
                    </div>

                    <div class="col-md-3">
                        <b>Order ID</b>
                        <div id="showOrder">-</div>
                    </div>

                    <div class="col-md-3">
                        <b>Courier</b>
                        <div id="showCourier">-</div>
                    </div>

                    <div class="col-md-3">
                        <b>Status</b>
                        <div id="showStatus">-</div>
                    </div>

                </div>

            </div>

        </div>

        <!-- Timeline -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                Tracking Timeline
            </div>

            <div
                class="card-body"
                id="timeline">

                <div class="alert alert-secondary">

                    Search AWB To View Timeline

                </div>

            </div>

        </div>

        <!-- Recent Tracking -->

        <div class="card shadow-sm">

            <div class="card-header">
                Recent Tracking
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-bordered table-hover">

                        <thead>

                            <tr>
                                <th>AWB</th>
                                <th>Order ID</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>

                        </thead>

                        <tbody id="trackingTable">

                            <tr>
                                <td colspan="4" class="text-center">
                                    No Tracking Found
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

async function trackAWB(awb){

    const awb =
    document
    .getElementById("trackAwb")
    .value
    .trim();

    if(!awb){

        alert("Enter AWB Number");
        return;

    }

    document.getElementById("timeline").innerHTML =
    `
    <div class="alert alert-info">
        Fetching Tracking...
    </div>
    `;

    const data =
    await window.trackAWB(awb);

    if(!data.success){

        document.getElementById("timeline").innerHTML =
        `
        <div class="alert alert-danger">
            ${data.message || "Tracking Not Found"}
        </div>
        `;

        return;

    }

    const shipment =
    data.shipment || {};

    document.getElementById("showAwb").innerHTML =
    awb;

    document.getElementById("showOrder").innerHTML =
    shipment.order_id ||
    shipment.orderId ||
    shipment.reference_number ||
    "-";

    document.getElementById("showCourier").innerHTML =
    "BOXD";

    document.getElementById("showStatus").innerHTML =
    shipment.status || "-";

    let timelineHtml = "";

    if(shipment.tracking_events){

        shipment.tracking_events
        .forEach(event=>{

            timelineHtml +=
            `
            <div class="border-start border-primary ps-3 mb-3">
                <b>${event.status || "-"}</b><br>
                ${event.created_at || ""}
            </div>
            `;

        });

    }

    if(!timelineHtml){

        timelineHtml =
        `
        <div class="alert alert-secondary">
            No Timeline Available
        </div>
        `;
    }

    document.getElementById("timeline").innerHTML =
    timelineHtml;

}

</script>
