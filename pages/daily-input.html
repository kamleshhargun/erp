<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">📥 Daily Input</h4>
    </div>

    <div class="card-body">

        <!-- MODE BUTTONS -->

        <div class="row mb-4">

            <div class="col-md-4">
                <button
                    id="pickupBtn"
                    class="btn btn-success w-100"
                    onclick="setMode('Pickup')">

                    Pickup Mode

                </button>
            </div>

            <div class="col-md-4">
                <button
                    id="returnBtn"
                    class="btn btn-danger w-100"
                    onclick="setMode('Return')">

                    Return Mode

                </button>
            </div>

            <div class="col-md-4">
                <button
                    class="btn btn-secondary w-100"
                    onclick="stopScanning()">

                    Stop Scan

                </button>
            </div>

        </div>

        <!-- CURRENT MODE -->

        <div class="alert alert-primary">

            Current Mode :
            <strong id="currentMode">
                Pickup
            </strong>

        </div>

        <!-- AWB INPUT -->

        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Scan / Enter AWB
                </label>

                <input
                    type="text"
                    id="awb"
                    class="form-control form-control-lg text-center fw-bold"
                    placeholder="Scan AWB Here"
                    autocomplete="off"
                    autofocus>

            </div>

        </div>

        <!-- LAST SCAN -->

        <div class="card shadow-sm mb-3">

            <div class="card-header">
                Last Scan
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6">
                        <b>AWB</b>
                        <div id="lastAwb">-</div>
                    </div>

                    <div class="col-md-6">
                        <b>Type</b>
                        <div id="lastType">-</div>
                    </div>

                </div>

            </div>

        </div>

        <!-- STATUS -->

        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <div
                    id="statusBox"
                    class="fw-bold text-primary">

                    Ready To Scan

                </div>

            </div>

        </div>

        <!-- COUNTS -->

        <div class="row mb-3">

            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-header">
                        Today's Count
                    </div>

                    <div class="card-body">

                        <h5>
                            Pickup :
                            <span id="pickupCount">
                                0
                            </span>
                        </h5>

                        <h5>
                            Return :
                            <span id="returnCount">
                                0
                            </span>
                        </h5>

                    </div>

                </div>

            </div>

            <!-- RECENT SCANS -->

            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-header">
                        Recent Scans
                    </div>

                    <div class="card-body">

                        <ul
                            id="recentScans"
                            class="list-group">

                        </ul>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

let mode = "Pickup";
let active = true;
let recentScans = [];

/* ==========================
   MODE CHANGE
========================== */

function setMode(type){

    mode = type;
    active = true;

    document.getElementById(
        "currentMode"
    ).innerText = type;

    document.getElementById(
        "statusBox"
    ).innerHTML =
    "Ready To Scan";

    document.getElementById(
        "awb"
    ).focus();

}

/* ==========================
   STOP SCAN
========================== */

function stopScanning(){

    active = false;

    document.getElementById(
        "statusBox"
    ).innerHTML =
    "Scanning Stopped";

}

/* ==========================
   BEEP
========================== */

function beep(){

    const ctx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const osc =
    ctx.createOscillator();

    const gain =
    ctx.createGain();

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    osc.frequency.value = 900;

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime + 0.20
    );

    osc.stop(
        ctx.currentTime + 0.20
    );

}

/* ==========================
   RECENT SCANS
========================== */

function addRecentScan(
    awb,
    type
){

    recentScans.unshift({
        awb,
        type
    });

    if(
        recentScans.length > 10
    ){
        recentScans.pop();
    }

    let html = "";

    recentScans.forEach(row=>{

        html += `
        <li class="list-group-item">

            <div>
                <strong>${row.awb}</strong>
            </div>

            <span class="
                badge
                ${row.type === 'Pickup'
                ? 'bg-success'
                : 'bg-danger'}
            ">
                ${row.type}
            </span>

        </li>
        `;

    });

    document.getElementById(
        "recentScans"
    ).innerHTML =
    html;

}

/* ==========================
   AWB SCAN
========================== */

document
.getElementById("awb")
.addEventListener(
"keydown",
async function(e){

    if(e.key !== "Enter")
    return;

    if(!active)
    return;

    const awb =
    this.value.trim();

    if(!awb)
    return;

    this.disabled = true;

    document.getElementById(
        "statusBox"
    ).innerHTML =
    "Saving...";

    try{

        const save =
        await saveScan(
            awb,
            mode
        );

        if(save.success){

            beep();

            document.getElementById(
                "statusBox"
            ).innerHTML =
            "✅ Saved Successfully";

            document.getElementById(
                "lastAwb"
            ).innerHTML =
            awb;

            document.getElementById(
                "lastType"
            ).innerHTML =
            mode;

            addRecentScan(
                awb,
                mode
            );

            await loadTodayCounts();

        }else{

            document.getElementById(
                "statusBox"
            ).innerHTML =
            save.message ||
            "Save Failed";

        }

    }catch(err){

        document.getElementById(
            "statusBox"
        ).innerHTML =
        err.toString();

    }

    this.value = "";

    this.disabled = false;

    this.focus();

});

/* ==========================
   INIT
========================== */

loadTodayCounts();

setTimeout(()=>{

    document
    .getElementById(
        "awb"
    )
    .focus();

},300);

</script>
