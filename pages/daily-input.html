<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">📥 Daily Input</h4>
    </div>

    <div class="card-body">

        <!-- Mode Buttons -->

        <div class="row mb-4">

            <div class="col-md-4 mb-2">

                <button
                    id="pickupBtn"
                    class="btn btn-success w-100"
                    onclick="setMode('Pickup')">

                    📦 Pickup Mode

                </button>

            </div>

            <div class="col-md-4 mb-2">

                <button
                    id="returnBtn"
                    class="btn btn-outline-danger w-100"
                    onclick="setMode('Return')">

                    ↩ Return Mode

                </button>

            </div>

            <div class="col-md-4 mb-2">

                <button
                    class="btn btn-secondary w-100"
                    onclick="stopScanning()">

                    ⛔ Stop Scan

                </button>

            </div>

        </div>

        <!-- Current Mode -->

        <div class="alert alert-primary">

            Current Mode :
            <strong id="currentMode">
                Pickup
            </strong>

        </div>

        <!-- Scanner Input -->

        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Scan AWB
                </label>

                <input
                    type="text"
                    id="awb"
                    class="form-control form-control-lg text-center fw-bold"
                    placeholder="Scan AWB Here"
                    autocomplete="off">

            </div>

        </div>

        <!-- Tracking Details -->

        <div class="card shadow-sm mb-3">

            <div class="card-header">
                Order Details
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-2">

                        <b>AWB</b>

                        <div id="showAwb">-</div>

                    </div>

                    <div class="col-md-4 mb-2">

                        <b>Order ID</b>

                        <div id="showOrderId">-</div>

                    </div>

                    <div class="col-md-4 mb-2">

                        <b>Courier</b>

                        <div id="showCustomer">-</div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Status -->

        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <div
                    id="statusBox"
                    class="alert alert-primary mb-0">

                    Ready To Scan

                </div>

            </div>

        </div>

        <!-- Summary -->

        <div class="row">

            <div class="col-md-6 mb-3">

                <div class="card shadow-sm">

                    <div class="card-header">
                        Today's Count
                    </div>

                    <div class="card-body">

                        <h5>
                            Pickup :
                            <span
                                id="pickupCount"
                                class="badge bg-success">

                                0

                            </span>
                        </h5>

                        <h5>
                            Return :
                            <span
                                id="returnCount"
                                class="badge bg-danger">

                                0

                            </span>
                        </h5>

                    </div>

                </div>

            </div>

            <div class="col-md-6 mb-3">

                <div class="card shadow-sm">

                    <div class="card-header">
                        Recent Scans
                    </div>

                    <div class="card-body">

                        <ul
                            id="recentScans"
                            class="list-group">

                        </ul>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

let mode = "Pickup";
let active = true;
let processing = false;
let recentScans = [];

// DOM

const awbInput = document.getElementById("awb");
const currentMode = document.getElementById("currentMode");
const statusBox = document.getElementById("statusBox");

const showAwb = document.getElementById("showAwb");
const showOrderId = document.getElementById("showOrderId");
const showCustomer = document.getElementById("showCustomer");

const recentScansList =
    document.getElementById("recentScans");

const pickupBtn =
    document.getElementById("pickupBtn");

const returnBtn =
    document.getElementById("returnBtn");

// Status

function updateStatus(
    message,
    type = "primary"
){

    statusBox.className =
        `alert alert-${type} mb-0`;

    statusBox.innerHTML = message;
}

// Mode

function setMode(type){

    mode = type;
    active = true;

    currentMode.textContent = type;

    if(type === "Pickup"){

        pickupBtn.className =
            "btn btn-success w-100";

        returnBtn.className =
            "btn btn-outline-danger w-100";

    }else{

        pickupBtn.className =
            "btn btn-outline-success w-100";

        returnBtn.className =
            "btn btn-danger w-100";
    }

    updateStatus(
        `Ready To Scan (${type})`,
        "primary"
    );

    awbInput.focus();
}

// Stop

function stopScanning(){

    active = false;

    updateStatus(
        "Scanning Stopped",
        "danger"
    );
}

// Recent Scans

function addRecentScan(
    awb,
    orderId,
    scanType
){

    recentScans.unshift({
        awb,
        orderId,
        scanType
    });

    if(
        recentScans.length > 10
    ){
        recentScans.pop();
    }

    renderRecentScans();
}

function renderRecentScans(){

    let html = "";

    recentScans.forEach(row=>{

        html += `
        <li class="list-group-item">

            <strong>${row.awb}</strong>

            <br>

            <small>
                Order :
                ${row.orderId}
            </small>

            <br>

            <span class="badge ${
                row.scanType === "Pickup"
                ? "bg-success"
                : "bg-danger"
            }">

                ${row.scanType}

            </span>

        </li>
        `;
    });

    recentScansList.innerHTML = html;
}

// Process Scan

async function processScan(awb){

    if(processing)
    return;

    processing = true;

    try{

        updateStatus(
            "Checking Tracking...",
            "info"
        );

        const tracking =
            await trackAWB(awb);

        if(
            !tracking.success
        ){

            updateStatus(
                tracking.message ||
                "Tracking Not Found",
                "danger"
            );

            return;
        }

        const orderId =

            tracking.orderId ||

            tracking.shipment?.order_id ||

            tracking.shipment?.orderId ||

            tracking.shipment?.reference_number ||

            tracking.shipment?.reference_no ||

            "-";

        showAwb.textContent =
            awb;

        showOrderId.textContent =
            orderId;

        showCustomer.textContent =
            tracking.courier ||
            "BOXD";

        updateStatus(
            "Saving Scan...",
            "warning"
        );

        const save =
            await saveScan(
                awb,
                mode
            );

        if(save.success){

            if(
                typeof beep ===
                "function"
            ){
                beep();
            }

            updateStatus(
                save.message ||
                "Saved Successfully",
                "success"
            );

            addRecentScan(
                awb,
                orderId,
                mode
            );

            if(
                typeof loadTodayCounts ===
                "function"
            ){
                await loadTodayCounts();
            }

        }else{

            updateStatus(
                save.message ||
                "Save Failed",
                "danger"
            );
        }

    }catch(error){

        console.error(error);

        updateStatus(
            error.message ||
            "Unexpected Error",
            "danger"
        );

    }finally{

        processing = false;

        awbInput.value = "";

        awbInput.focus();
    }
}

// Scanner Enter

awbInput.addEventListener(
    "keydown",
    async function(e){

        if(
            e.key !== "Enter"
        )
        return;

        if(!active)
        return;

        const awb =
            this.value.trim();

        if(!awb)
        return;

        await processScan(awb);
    }
);

// Init

updateStatus(
    "Ready To Scan",
    "primary"
);

awbInput.focus();

if(
    typeof loadTodayCounts ===
    "function"
){
    loadTodayCounts();
}

</script>
