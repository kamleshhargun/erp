<div class="card shadow-sm">

    <div class="card-header">
        <h4 class="mb-0">📥 Daily Input</h4>
    </div>

    <div class="card-body">

        <div class="row mb-4">

            <div class="col-md-4">
                <button
                    id="pickupBtn"
                    class="btn btn-success w-100"
                    onclick="setMode('Pickup')">
                    Pickup Mode
                </button>
            </div>

            <div class="col-md-4">
                <button
                    id="returnBtn"
                    class="btn btn-danger w-100"
                    onclick="setMode('Return')">
                    Return Mode
                </button>
            </div>

            <div class="col-md-4">
                <button
                    class="btn btn-secondary w-100"
                    onclick="stopScanning()">
                    Stop Scan
                </button>
            </div>

        </div>

        <div class="alert alert-primary">

            Current Mode :
            <strong id="currentMode">
                Pickup
            </strong>

        </div>

        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <label class="form-label">
                    Scan AWB
                </label>

                <input
                    type="text"
                    id="awb"
                    class="form-control form-control-lg text-center fw-bold"
                    placeholder="Scan AWB Here"
                    autofocus>

            </div>

        </div>

        <div class="card shadow-sm mb-3">

            <div class="card-header">
                Order Details
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4">
                        <b>AWB</b>
                        <div id="showAwb">-</div>
                    </div>

                    <div class="col-md-4">
                        <b>Order ID</b>
                        <div id="showOrderId">-</div>
                    </div>

                    <div class="col-md-4">
                        <b>Courier</b>
                        <div id="showCustomer">-</div>
                    </div>

                </div>

            </div>

        </div>

        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <div
                    id="statusBox"
                    class="fw-bold text-primary">

                    Ready To Scan

                </div>

            </div>

        </div>

        <div class="row">

            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-header">
                        Today's Count
                    </div>

                    <div class="card-body">

                        <h5>
                            Pickup :
                            <span id="pickupCount">
                                0
                            </span>
                        </h5>

                        <h5>
                            Return :
                            <span id="returnCount">
                                0
                            </span>
                        </h5>

                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-header">
                        Recent Scans
                    </div>

                    <div class="card-body">

                        <ul
                            id="recentScans"
                            class="list-group">
                        </ul>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

let mode = "Pickup";
let active = true;

function setMode(type){

    mode = type;

    document.getElementById(
        "currentMode"
    ).innerText = type;

    document.getElementById(
        "awb"
    ).focus();

}

function stopScanning(){

    active = false;

    document.getElementById(
        "statusBox"
    ).innerHTML =
    "Scanning Stopped";

}

document
.getElementById("awb")
.addEventListener(
"keydown",
async function(e){

    if(e.key !== "Enter")
    return;

    const awb =
    this.value.trim();

    if(!awb)
    return;

    document.getElementById(
        "statusBox"
    ).innerHTML =
    "Fetching Data...";

    setTimeout(()=>{

        document.getElementById(
            "showAwb"
        ).innerHTML =
        awb;

        document.getElementById(
            "showOrderId"
        ).innerHTML =
        "Loading...";

        document.getElementById(
            "showCustomer"
        ).innerHTML =
        "Loading...";

        document.getElementById(
            "statusBox"
        ).innerHTML =
        "Ready For Save";

    },500);

});

</script>
