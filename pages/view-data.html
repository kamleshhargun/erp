<div class="card shadow-sm">

    <div class="card-header">
        <h4 class="mb-0">
            📋 Monthly Sheet Data
        </h4>
    </div>

    <div class="card-body">

        <div class="row mb-3">

            <div class="col-md-4">

                <label class="form-label">
                    Month Sheet Name
                </label>

                <input
                    type="text"
                    id="monthInput"
                    class="form-control"
                    placeholder="06/2026">

            </div>

            <div class="col-md-2 d-flex align-items-end">

                <button
                    class="btn btn-primary w-100"
                    onclick="loadSheetData()">

                    Load Data

                </button>

            </div>

        </div>

        <div class="row mb-3">

            <div class="col-md-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h6>Total Records</h6>

                        <h3 id="totalRecords">
                            0
                        </h3>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h6>Pickup</h6>

                        <h3 id="pickupRecords">
                            0
                        </h3>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card">

                    <div class="card-body text-center">

                        <h6>Return</h6>

                        <h3 id="returnRecords">
                            0
                        </h3>

                    </div>

                </div>

            </div>

        </div>

        <div class="table-responsive">

            <table
                class="table table-bordered table-striped table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>Date</th>
                        <th>Time</th>
                        <th>AWB</th>
                        <th>Type</th>
                        <th>Order ID</th>

                    </tr>

                </thead>

                <tbody id="sheetTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="text-center">

                            No Data Loaded

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

async function loadSheetData(){

    const month =
    document.getElementById(
        "monthInput"
    ).value.trim();

    if(!month){

        alert(
            "Enter Month (Example : 06/2026)"
        );

        return;

    }

    document.getElementById(
        "sheetTableBody"
    ).innerHTML =
    `
    <tr>
        <td colspan="5" class="text-center">
            Loading...
        </td>
    </tr>
    `;

    const result =
    await getSheetData(
        month
    );

    if(!result.success){

        document.getElementById(
            "sheetTableBody"
        ).innerHTML =
        `
        <tr>
            <td colspan="5" class="text-center text-danger">
                ${result.message}
            </td>
        </tr>
        `;

        return;
    }

    let html = "";

    let pickup = 0;
    let ret = 0;

    result.data.forEach(row=>{

        if(row[3] === "Pickup")
        pickup++;

        if(row[3] === "Return")
        ret++;

        html += `
        <tr>

            <td>${row[0]}</td>

            <td>${row[1]}</td>

            <td>${row[2]}</td>

            <td>

                <span class="
                    badge
                    ${row[3] === 'Pickup'
                        ? 'bg-success'
                        : 'bg-danger'}
                ">
                    ${row[3]}
                </span>

            </td>

            <td>${row[4]}</td>

        </tr>
        `;

    });

    if(result.data.length === 0){

        html =
        `
        <tr>

            <td colspan="5"
                class="text-center">

                No Records Found

            </td>

        </tr>
        `;
    }

    document.getElementById(
        "sheetTableBody"
    ).innerHTML =
    html;

    document.getElementById(
        "totalRecords"
    ).innerHTML =
    result.data.length;

    document.getElementById(
        "pickupRecords"
    ).innerHTML =
    pickup;

    document.getElementById(
        "returnRecords"
    ).innerHTML =
    ret;

}

</script>
