<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">📋 Monthly Sheet Data</h4>
    </div>

    <div class="card-body">

        <!-- Filter Section -->

        <div class="row mb-4">

            <div class="col-md-4 mb-2">

                <label class="form-label">
                    Month Sheet Name
                </label>

                <input
                    type="text"
                    id="monthInput"
                    class="form-control"
                    placeholder="06/2026">

            </div>

            <div class="col-md-2 mb-2 d-flex align-items-end">

                <button
                    id="loadBtn"
                    class="btn btn-primary w-100"
                    onclick="loadSheetData()">

                    📥 Load Data

                </button>

            </div>

            <div class="col-md-3 mb-2 d-flex align-items-end">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search AWB / Order ID">

            </div>

        </div>

        <!-- Summary Cards -->

        <div class="row mb-4">

            <div class="col-md-4 mb-3">

                <div class="card border-primary">

                    <div class="card-body text-center">

                        <h6>Total Records</h6>

                        <h2
                            id="totalRecords"
                            class="text-primary">

                            0

                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="card border-success">

                    <div class="card-body text-center">

                        <h6>Pickup</h6>

                        <h2
                            id="pickupRecords"
                            class="text-success">

                            0

                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="card border-danger">

                    <div class="card-body text-center">

                        <h6>Return</h6>

                        <h2
                            id="returnRecords"
                            class="text-danger">

                            0

                        </h2>

                    </div>

                </div>

            </div>

        </div>

        <!-- Table -->

        <div class="table-responsive">

            <table
                class="table table-bordered table-striped table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>Date</th>
                        <th>Time</th>
                        <th>AWB</th>
                        <th>Type</th>
                        <th>Order ID</th>

                    </tr>

                </thead>

                <tbody id="sheetTableBody">

                    <tr>

                        <td
                            colspan="5"
                            class="text-center">

                            No Data Loaded

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const monthInput =
    document.getElementById("monthInput");

const loadBtn =
    document.getElementById("loadBtn");

const tableBody =
    document.getElementById("sheetTableBody");

const searchInput =
    document.getElementById("searchInput");

const totalRecords =
    document.getElementById("totalRecords");

const pickupRecords =
    document.getElementById("pickupRecords");

const returnRecords =
    document.getElementById("returnRecords");

let allData = [];

/* Load Data */

async function loadSheetData(){

    const month =
        monthInput.value.trim();

    if(!month){

        alert(
            "Enter Month Example : 06/2026"
        );

        monthInput.focus();

        return;
    }

    const monthRegex =
        /^(0[1-9]|1[0-2])\/\d{4}$/;

    if(
        !monthRegex.test(month)
    ){

        alert(
            "Month Format Must Be MM/YYYY"
        );

        return;
    }

    try{

        loadBtn.disabled = true;

        tableBody.innerHTML = `
        <tr>

            <td colspan="5"
                class="text-center">

                <div
                    class="spinner-border spinner-border-sm">

                </div>

                Loading...

            </td>

        </tr>
        `;

        const result =
            await getSheetData(month);

        if(
            !result.success
        ){

            tableBody.innerHTML = `
            <tr>

                <td colspan="5"
                    class="text-center text-danger">

                    ${
                        result.message ||
                        "Failed To Load Data"
                    }

                </td>

            </tr>
            `;

            return;
        }

        allData =
            result.data || [];

        renderTable(allData);

        updateSummary(allData);

    }
    catch(error){

        console.error(error);

        tableBody.innerHTML = `
        <tr>

            <td colspan="5"
                class="text-center text-danger">

                Server Error

            </td>

        </tr>
        `;

    }
    finally{

        loadBtn.disabled = false;
    }
}

/* Render Table */

function renderTable(data){

    if(!data.length){

        tableBody.innerHTML = `
        <tr>

            <td colspan="5"
                class="text-center">

                No Records Found

            </td>

        </tr>
        `;

        return;
    }

    let html = "";

    data.forEach(row=>{

        html += `
        <tr>

            <td>${row[0] || "-"}</td>

            <td>${row[1] || "-"}</td>

            <td>

                <strong>

                    ${row[2] || "-"}

                </strong>

            </td>

            <td>

                <span class="badge ${
                    row[3] === "Pickup"
                    ? "bg-success"
                    : "bg-danger"
                }">

                    ${row[3] || "-"}

                </span>

            </td>

            <td>${row[4] || "-"}</td>

        </tr>
        `;
    });

    tableBody.innerHTML = html;
}

/* Summary */

function updateSummary(data){

    let pickup = 0;
    let ret = 0;

    data.forEach(row=>{

        if(
            row[3] === "Pickup"
        ){
            pickup++;
        }

        if(
            row[3] === "Return"
        ){
            ret++;
        }

    });

    totalRecords.textContent =
        data.length;

    pickupRecords.textContent =
        pickup;

    returnRecords.textContent =
        ret;
}

/* Search Filter */

searchInput.addEventListener(
    "keyup",
    function(){

        const keyword =
            this.value
            .toLowerCase()
            .trim();

        const filtered =
            allData.filter(row =>

                String(row[2] || "")
                .toLowerCase()
                .includes(keyword)

                ||

                String(row[4] || "")
                .toLowerCase()
                .includes(keyword)

            );

        renderTable(filtered);
    }
);

/* Enter Key Support */

monthInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
        ){

            loadSheetData();
        }
    }
);

/* Auto Current Month */

window.addEventListener(
    "load",
    function(){

        const now =
            new Date();

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2,"0");

        monthInput.value =
            month +
            "/" +
            now.getFullYear();

    }
);

</script>
