<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Input - Harsidhi Ventures ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
}

.container-box{
    max-width:900px;
    margin:auto;
    margin-top:20px;
}

.mode-btn{
    min-width:150px;
}

.info-card{
    border-radius:10px;
}

.scan-input{
    height:60px;
    font-size:24px;
    font-weight:bold;
}

.status-box{
    min-height:50px;
    font-size:18px;
    font-weight:600;
}

.recent-list{
    max-height:300px;
    overflow:auto;
}

.active-mode{
    border:3px solid #198754 !important;
}

</style>
</head>
<body>

<div class="container container-box">

<h2 class="text-center mb-4">
Daily Input
</h2>

<div class="text-center mb-4">

<button
id="pickupBtn"
class="btn btn-success mode-btn me-2"
onclick="setMode('Pickup')">
Pickup
</button>

<button
id="returnBtn"
class="btn btn-danger mode-btn me-2"
onclick="setMode('Return')">
Return
</button>

<button
class="btn btn-secondary mode-btn"
onclick="stopScanning()">
Stop
</button>

</div>

<div class="card info-card shadow-sm mb-3">
<div class="card-body">

<h5>
Current Mode :
<span id="currentMode">
Pickup
</span>
</h5>

</div>
</div>

<div class="card shadow-sm mb-3">
<div class="card-body">

<label class="form-label">
Scan AWB
</label>

<input
type="text"
id="awb"
class="form-control scan-input"
autocomplete="off"
autofocus
placeholder="Scan AWB Here">

</div>
</div>

<div class="card shadow-sm mb-3">
<div class="card-header">
Order Details
</div>

<div class="card-body">

<div class="row">

<div class="col-md-4">
<b>AWB</b>
<div id="showAwb">-</div>
</div>

<div class="col-md-4">
<b>Order ID</b>
<div id="showOrderId">-</div>
</div>

<div class="col-md-4">
<b>Customer</b>
<div id="showCustomer">-</div>
</div>

</div>

</div>
</div>

<div class="card shadow-sm mb-3">
<div class="card-body">

<div
id="statusBox"
class="status-box text-primary">
Ready To Scan
</div>

</div>
</div>

<div class="row">

<div class="col-md-6">

<div class="card shadow-sm">

<div class="card-header">
Today's Count
</div>

<div class="card-body">

<h5>
Pickup :
<span id="pickupCount">
0
</span>
</h5>

<h5>
Return :
<span id="returnCount">
0
</span>
</h5>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card shadow-sm">

<div class="card-header">
Recent Scans
</div>

<div class="card-body recent-list">

<ul
id="recentScans"
class="list-group">
</ul>

</div>

</div>

</div>

</div>

</div>

<script>

let mode = "Pickup";
let active = true;

let pickupCount = 0;
let returnCount = 0;

function setMode(type){

    mode = type;

    document.getElementById(
        "currentMode"
    ).innerText = type;

    document
    .getElementById("awb")
    .focus();

}

function stopScanning(){

    active = false;

    document.getElementById(
        "statusBox"
    ).innerHTML =
    "Scanning Stopped";

}

function beep(){

    const ctx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    const osc =
    ctx.createOscillator();

    osc.connect(
      ctx.destination
    );

    osc.start();

    setTimeout(()=>{

      osc.stop();

    },150);

}

async function fetchAWBDetails(awb){

    /*
    Future API

    const res =
    await fetch(API_URL + awb);

    return await res.json();
    */

    return {

        success:true,

        awb:awb,

        orderId:
        "ORD" +
        Math.floor(
        Math.random()*10000
        ),

        customer:
        "Customer Name"

    };

}

async function saveToGoogleSheet(data){

    /*
    Future Apps Script

    await fetch(
      SAVE_URL,
      {
        method:"POST",
        body:
        JSON.stringify(data)
      }
    );
    */

    return {

        success:true

    };

}

document
.getElementById("awb")
.addEventListener(
"keydown",
async function(e){

if(
e.key !== "Enter"
) return;

if(!active){

    active = true;

}

const awb =
this.value.trim();

if(!awb) return;

document
.getElementById(
"statusBox"
).innerHTML =
"Fetching Data...";

const data =
await fetchAWBDetails(
awb
);

document
.getElementById(
"showAwb"
).innerText =
data.awb;

document
.getElementById(
"showOrderId"
).innerText =
data.orderId;

document
.getElementById(
"showCustomer"
).innerText =
data.customer;

document
.getElementById(
"statusBox"
).innerHTML =
"Saving...";

setTimeout(
async ()=>{

const save =
await saveToGoogleSheet({

awb,

type:mode

});

if(
save.success
){

if(
mode==="Pickup"
){

pickupCount++;

document
.getElementById(
"pickupCount"
).innerText =
pickupCount;

}
else{

returnCount++;

document
.getElementById(
"returnCount"
).innerText =
returnCount;

}

const li =
document.createElement(
"li"
);

li.className =
"list-group-item";

li.innerHTML =
mode +
" - " +
awb;

document
.getElementById(
"recentScans"
)
.prepend(li);

beep();

document
.getElementById(
"statusBox"
).innerHTML =
"✓ Saved Successfully";

}
else{

document
.getElementById(
"statusBox"
).innerHTML =
"Save Failed";

}

document
.getElementById(
"awb"
).value="";

document
.getElementById(
"awb"
).focus();

},2000);

});

document
.getElementById(
"awb"
).focus();

</script>

</body>
</html>
