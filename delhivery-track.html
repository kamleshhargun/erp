
<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="config.js"></script>

<title>Tracking Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:
  linear-gradient(135deg,#0f172a,#1e293b);
  min-height:100vh;
  color:#fff;
}

.container{
  max-width:460px;
  margin:auto;
  padding:20px 15px 40px;
}

.top{
  text-align:center;
  margin-bottom:20px;
}

.top h1{
  margin:0;
  font-size:28px;
}

.top p{
  color:#cbd5e1;
  margin-top:6px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.input-group{
  margin-bottom:15px;
}

.label{
  display:block;
  color:#334155;
  margin-bottom:6px;
  font-size:13px;
  font-weight:600;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  font-size:15px;
}

input:focus{
  outline:none;
  border-color:#2563eb;
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:
  linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
}

.save{
  margin-top:10px;
  background:
  linear-gradient(135deg,#059669,#047857);
  color:#fff;
  display:none;
}

.back{
  margin-top:15px;
  background:#111827;
  color:#fff;
}

.loader{
  text-align:center;
  padding:18px;
  color:#475569;
}

.error{
  background:#fee2e2;
  color:#b91c1c;
  padding:12px;
  border-radius:12px;
  margin-top:15px;
}

.result-card{
  margin-top:18px;
  background:#f8fafc;
  border-radius:18px;
  padding:18px;
  color:#111827;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.badge{
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.delivered{
  background:#dcfce7;
  color:#166534;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.transit{
  background:#dbeafe;
  color:#1d4ed8;
}

.courier{
  background:#111827;
  color:#fff;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.info{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  border-bottom:1px dashed #cbd5e1;
  padding-bottom:10px;
}

.left{
  color:#64748b;
}

.right{
  font-weight:700;
  text-align:right;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:12px;
  border-radius:12px;
  margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="top">
<h1>📦 Tracking Dashboard</h1>
<p>Delhivery + BOXD Logistics</p>
</div>

<div class="card">

<div class="input-group">
<label class="label">Order ID</label>
<input id="order" placeholder="Enter Order ID">
</div>

<div class="input-group">
<label class="label">Tracking Number</label>
<input id="tracking" placeholder="Enter Tracking ID">
</div>

<button class="primary" onclick="trackOrder()">
Track Shipment
</button>

<button
id="saveBtn"
class="save"
onclick="saveTracking()">

Save Tracking

</button>

<div id="result"></div>

</div>

<button class="back" onclick="goHome()">
⬅ Back To Home
</button>

</div>

<script>

let currentData = null;

function trackOrder(){

  const orderId =
    document.getElementById("order").value.trim();

  const tracking =
    document.getElementById("tracking").value.trim();

  const result =
    document.getElementById("result");

  if(!orderId || !tracking){

    result.innerHTML =
      `<div class="error">
        Please enter Order ID & Tracking ID
      </div>`;

    return;
  }

  result.innerHTML =
    `<div class="loader">
      ⏳ Fetching Tracking...
    </div>`;

  fetch(API.track(orderId,tracking))

  .then(r=>r.json())

  .then(d=>{

    if(d.error){

      result.innerHTML =
        `<div class="error">${d.error}</div>`;

      return;
    }

    currentData = d;

    document
      .getElementById("saveBtn")
      .style.display = "block";

    let statusClass = "pending";

    const s =
      String(d.status || "").toLowerCase();

    if(s.includes("deliver")){
      statusClass = "delivered";
    }
    else if(
      s.includes("transit") ||
      s.includes("ship")
    ){
      statusClass = "transit";
    }

    result.innerHTML = `

      <div class="result-card">

        <div class="top-row">

          <div class="badge ${statusClass}">
            ${d.status}
          </div>

          <div class="courier">
            ${d.courier}
          </div>

        </div>

        <div class="info">
          <div class="left">📍 Location</div>
          <div class="right">${d.location}</div>
        </div>

        <div class="info">
          <div class="left">👤 Customer</div>
          <div class="right">${d.customer}</div>
        </div>

        <div class="info">
          <div class="left">🏠 State</div>
          <div class="right">${d.state}</div>
        </div>

        <div class="info">
          <div class="left">💳 Payment</div>
          <div class="right">${d.payment}</div>
        </div>

        <div class="info">
          <div class="left">💰 Amount</div>
          <div class="right">₹${d.amount}</div>
        </div>

      </div>

    `;
  })

  .catch(()=>{

    result.innerHTML =
      `<div class="error">
        Network Error ❌
      </div>`;
  });
}

function saveTracking(){

  if(!currentData){
    return;
  }

  fetch(API.post,{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      type:"saveTracking",

      order_id:currentData.order_id,
      tracking:currentData.tracking,
      status:currentData.status,
      location:currentData.location,
      customer:currentData.customer,
      state:currentData.state,
      amount:currentData.amount,
      payment:currentData.payment,
      courier:currentData.courier,
      api_source:currentData.api_source

    })

  })

  .then(r=>r.json())

  .then(d=>{

    if(d.status === "saved"){

      document.getElementById("result")
      .innerHTML +=
      `<div class="success">
        Tracking Saved Successfully ✅
      </div>`;

      document
        .getElementById("saveBtn")
        .style.display = "none";

    }else if(d.duplicate){

      alert("Already Saved");

    }else{

      alert("Save Failed");
    }

  })

  .catch(()=>{

    alert("Network Error");

  });
}

function goHome(){
  location.href = "index.html";
}

</script>

</body>
</html>
