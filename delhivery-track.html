<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="config.js"></script>

<title>Tracking Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:
  linear-gradient(135deg,#0f172a,#1e293b);
  min-height:100vh;
  color:#fff;
}

.container{
  max-width:460px;
  margin:auto;
  padding:20px 15px 40px;
}

.top{
  text-align:center;
  margin-bottom:20px;
}

.top h1{
  margin:0;
  font-size:28px;
  font-weight:700;
}

.top p{
  margin-top:6px;
  color:#cbd5e1;
  font-size:14px;
}

.card{
  background:#ffffff;
  border-radius:22px;
  padding:20px;
  box-shadow:
  0 15px 40px rgba(0,0,0,.25);
}

.input-group{
  margin-bottom:15px;
}

.label{
  display:block;
  color:#334155;
  font-size:13px;
  margin-bottom:6px;
  font-weight:600;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  font-size:15px;
  transition:.3s;
}

input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.primary{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
}

.primary:hover{
  transform:translateY(-1px);
}

.back{
  margin-top:14px;
  background:#111827;
  color:#fff;
}

.loader{
  text-align:center;
  padding:18px;
  color:#475569;
}

.error{
  background:#fee2e2;
  color:#b91c1c;
  padding:12px;
  border-radius:12px;
  margin-top:15px;
  font-size:14px;
}

.result-card{
  margin-top:18px;
  background:#f8fafc;
  border-radius:18px;
  padding:18px;
  color:#111827;
  border:1px solid #e2e8f0;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.badge{
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.delivered{
  background:#dcfce7;
  color:#166534;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.transit{
  background:#dbeafe;
  color:#1d4ed8;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  border-bottom:1px dashed #cbd5e1;
  padding-bottom:10px;
}

.info:last-child{
  border-bottom:none;
  margin-bottom:0;
  padding-bottom:0;
}

.left{
  color:#64748b;
  font-size:14px;
}

.right{
  font-weight:700;
  font-size:14px;
  text-align:right;
  word-break:break-word;
}

.courier{
  background:#111827;
  color:#fff;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

</style>

</head>

<body>

<div class="container">

<div class="top">
<h1>📦 Tracking Dashboard</h1>
<p>Delhivery + BOXD Logistics Tracking</p>
</div>

<div class="card">

<div class="input-group">
<label class="label">Order ID</label>
<input id="order" placeholder="Enter Order ID">
</div>

<div class="input-group">
<label class="label">Tracking Number</label>
<input id="tracking" placeholder="Enter Tracking ID">
</div>

<button class="primary" onclick="trackOrder()">
Track Shipment
</button>

<div id="result"></div>

</div>

<button class="back" onclick="goHome()">
⬅ Back to Home
</button>

</div>

<script>

function trackOrder(){

  const orderId =
    document.getElementById("order").value.trim();

  const tracking =
    document.getElementById("tracking").value.trim();

  const result =
    document.getElementById("result");

  if(!orderId || !tracking){

    result.innerHTML =
      `<div class="error">
        Please enter Order ID & Tracking ID
      </div>`;

    return;
  }

  result.innerHTML =
    `<div class="loader">
      ⏳ Fetching Tracking Details...
    </div>`;

  fetch(API.track(orderId, tracking))

  .then(r=>r.json())

  .then(d=>{

    if(d.error){

      result.innerHTML =
        `<div class="error">${d.error}</div>`;

      return;
    }

    let statusClass = "pending";

    const s =
      String(d.status || "").toLowerCase();

    if(s.includes("deliver")){
      statusClass = "delivered";
    }
    else if(
      s.includes("transit") ||
      s.includes("ship") ||
      s.includes("out for")
    ){
      statusClass = "transit";
    }

    result.innerHTML = `

      <div class="result-card">

        <div class="top-row">

          <div class="badge ${statusClass}">
            ${d.status}
          </div>

          <div class="courier">
            ${d.courier}
          </div>

        </div>

        <div class="info">
          <div class="left">📍 Location</div>
          <div class="right">${d.location}</div>
        </div>

        <div class="info">
          <div class="left">👤 Customer</div>
          <div class="right">${d.customer}</div>
        </div>

        <div class="info">
          <div class="left">🏠 State</div>
          <div class="right">${d.state}</div>
        </div>

        <div class="info">
          <div class="left">💳 Payment</div>
          <div class="right">${d.payment}</div>
        </div>

        <div class="info">
          <div class="left">💰 Amount</div>
          <div class="right">₹${d.amount}</div>
        </div>

        <div class="info">
          <div class="left">📦 Tracking</div>
          <div class="right">${d.tracking}</div>
        </div>

      </div>

    `;
  })

  .catch(()=>{

    result.innerHTML =
      `<div class="error">
        Network Error ❌
      </div>`;
  });
}

function goHome(){
  location.href="index.html";
}

</script>

</body>
</html>
