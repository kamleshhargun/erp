<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HARSIDHI VENTURES</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="config.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f5f5f5;
}

.app{
  max-width:420px;
  margin:auto;
  background:#fff;
  min-height:100vh;
}

header{
  padding:16px;
  text-align:center;
  font-weight:600;
  font-size:18px;
  border-bottom:1px solid #eee;
}

.card{
  margin:12px;
  padding:14px;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.stats{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.stats div{
  flex:1;
  background:#f8f9fa;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:13px;
}

.big{
  font-size:18px;
  font-weight:600;
  margin-top:5px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  padding:14px;
  border:none;
  border-radius:10px;
  background:#1a73e8;
  color:#fff;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
}

button:active{
  transform:scale(0.97);
}

.footer{
  text-align:center;
  font-size:12px;
  color:#777;
  padding:12px;
}
</style>

</head>

<body>

<div class="app">

<header>HARSIDHI VENTURES</header>

<!-- ===== STATS ===== -->
<div class="card">
  <h3>📊 Dashboard</h3>

  <div class="stats">
    <div>Today Pickup<br><span id="todayPickup" class="big">0</span></div>
    <div>Today Return<br><span id="todayReturn" class="big">0</span></div>
  </div>

  <div class="stats">
    <div>Yesterday Pickup<br><span id="yestPickup" class="big">0</span></div>
    <div>Yesterday Return<br><span id="yestReturn" class="big">0</span></div>
  </div>

  <div class="stats">
    <div>Total Pickup<br><span id="totalPickup" class="big">0</span></div>
    <div>Total Return<br><span id="totalReturn" class="big">0</span></div>
  </div>

</div>

<!-- ===== NAVIGATION ===== -->
<div class="card">
  <h3>⚡ Quick Actions</h3>

  <div class="grid">
    <button onclick="go('daily.html')">📅 Daily</button>
    <button onclick="go('pickup.html')">📦 Pickup</button>
    <button onclick="go('return.html')">🔄 Return</button>
    <button onclick="go('return-request.html')">📥 Return Req</button>
  </div>
</div>

<!-- ===== EXTRA ===== -->
<div class="card">
  <h3>📂 Other</h3>

  <div class="grid">
    <button onclick="go('production/index.html')">🏭 Production</button>
    <button onclick="go('daily/index.html')">📊 Reports</button>
  </div>
</div>

<div class="footer">
  © Harsidhi Ventures
</div>

</div>

<script>

// ================= NAV =================
function go(page){
  window.location.href = page;
}

// ================= LOAD STATS =================
async function loadDashboard(){
  try{

    const res = await fetch(API.stats());
    const d = await res.json();

    console.log("Stats:", d);

    document.getElementById("todayPickup").innerText =
      d.todayPickup ?? d.today_pickup ?? 0;

    document.getElementById("todayReturn").innerText =
      d.todayReturn ?? d.today_return ?? 0;

    document.getElementById("yestPickup").innerText =
      d.yesterdayPickup ?? d.yesterday_pickup ?? 0;

    document.getElementById("yestReturn").innerText =
      d.yesterdayReturn ?? d.yesterday_return ?? 0;

    document.getElementById("totalPickup").innerText =
      d.totalPickup ?? d.total_pickup ?? 0;

    document.getElementById("totalReturn").innerText =
      d.totalReturn ?? d.total_return ?? 0;

  }catch(e){
    console.log("Stats Error:", e);
  }
}

// INIT
document.addEventListener("DOMContentLoaded", ()=>{
  loadDashboard();
  setInterval(loadDashboard, 5000);
});

</script>

</body>
</html>
