<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>HARSIDHI VENTURES ERP</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="config.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f2f3f7;
}

.app{
  max-width:420px;
  margin:auto;
  background:#fff;
  min-height:100vh;
}

/* HEADER */
header{
  padding:16px;
  text-align:center;
  font-weight:600;
  font-size:18px;
  border-bottom:1px solid #eee;
  background:#ffffff;
}

/* CARD */
.card{
  margin:12px;
  padding:14px;
  border-radius:14px;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
}

h3{
  margin:0 0 10px;
  font-size:15px;
}

/* STATS */
.stats{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.stats div{
  flex:1;
  background:#f8f9fb;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
}

.big{
  font-size:18px;
  font-weight:600;
  margin-top:5px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* BUTTON */
button{
  padding:14px;
  border:none;
  border-radius:10px;
  background:#1a73e8;
  color:#fff;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  background:#155cc6;
}

button:active{
  transform:scale(0.97);
}

/* FOOTER */
.footer{
  text-align:center;
  font-size:12px;
  color:#777;
  padding:12px;
}
</style>

</head>

<body>

<div class="app">

<header>HARSIDHI VENTURES ERP</header>

<!-- DASHBOARD -->

<div class="card">
  <h3>📊 Dashboard</h3>

  <div class="stats">
    <div>Today Pickup<br><span id="todayPickup" class="big">-</span></div>
    <div>Today Return<br><span id="todayReturn" class="big">-</span></div>
  </div>

  <div class="stats">
    <div>Yesterday Pickup<br><span id="yestPickup" class="big">-</span></div>
    <div>Yesterday Return<br><span id="yestReturn" class="big">-</span></div>
  </div>

  <div class="stats">
    <div>Total Pickup<br><span id="totalPickup" class="big">-</span></div>
    <div>Total Return<br><span id="totalReturn" class="big">-</span></div>
  </div>
</div>

<!-- QUICK ACTION -->

<div class="card">
  <h3>⚡ Quick Actions</h3>

  <div class="grid">
    <button onclick="go('pickup.html')">📦 Pickup</button>
    <button onclick="go('return.html')">🔄 Return</button>
    <button onclick="go('return-request.html')">📥 Return Req</button>
  </div>
</div>

<!-- PRODUCTION -->

<div class="card">
  <h3>🏭 Production</h3>

  <div class="grid">
    <button onclick="go('production/production.html')">Main</button>
    <button onclick="go('production/cutting.html')">Cutting</button>
    <button onclick="go('production/fabric.html')">Fabric</button>
    <button onclick="go('production/stitching.html')">Stitching</button>
    <button onclick="go('production/finished.html')">Finished</button>
    <button onclick="go('production/production-ledger.html')">Ledger</button>
  </div>
</div>

<!-- EXTRA -->

<div class="card">
  <h3>📂 Other</h3>

  <div class="grid">
    <button onclick="go('lookup.html')">🔍 Lookup</button>
    <button onclick="go('delhivery-track.html')">🚚 Track</button>
  </div>
</div>

<div class="footer">
  © Harsidhi Ventures
</div>

</div>

<script>

// NAVIGATION
function go(page){
  window.location.href = page;
}

// LOAD DASHBOARD
async function loadDashboard(){
  try{

    const res = await fetch(API.stats());
    const d = await res.json();

    document.getElementById("todayPickup").innerText =
      d.todayPickup ?? d.today_pickup ?? 0;

    document.getElementById("todayReturn").innerText =
      d.todayReturn ?? d.today_return ?? 0;

    document.getElementById("yestPickup").innerText =
      d.yesterdayPickup ?? d.yesterday_pickup ?? 0;

    document.getElementById("yestReturn").innerText =
      d.yesterdayReturn ?? d.yesterday_return ?? 0;

    document.getElementById("totalPickup").innerText =
      d.totalPickup ?? d.total_pickup ?? 0;

    document.getElementById("totalReturn").innerText =
      d.totalReturn ?? d.total_return ?? 0;

  }catch(e){
    console.log("Stats Error:", e);

    document.querySelectorAll(".big").forEach(el=>{
      el.innerText = "0";
    });
  }
}

// INIT
document.addEventListener("DOMContentLoaded", ()=>{
  loadDashboard();
  setInterval(loadDashboard, 7000);
});

</script>

</body>
</html>
