<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Harsidhi Ventures ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
body{
    background:#f4f7fb;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#0f172a;
}

.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:12px 20px;
}

.sidebar a:hover{
    background:#2563eb;
}

.main{
    margin-left:250px;
}

.header{
    background:#fff;
    padding:15px 25px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.footer{
    background:#0f172a;
    color:#fff;
    text-align:center;
    padding:12px;
}
</style>

</head>

<body>

<div class="sidebar">

    <h4 class="text-white p-3">
        ERP
    </h4>

    <a href="#" onclick="showDashboard()">
        🏠 Dashboard
    </a>

    <a href="#" onclick="loadPage('daily-input')">
        📥 Daily Input
    </a>

    <a href="#" onclick="loadPage('order-track')">
        📦 Order Track
    </a>

</div>

<div class="main">

    <div class="header d-flex justify-content-between">

        <h3>
            Harsidhi Ventures ERP
        </h3>

        <div id="clock"></div>

    </div>

    <div class="container-fluid p-4">

        <div id="contentArea">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>
                        Welcome To Harsidhi Ventures ERP
                    </h4>

                    <p>
                        Select Menu From Left Side.
                    </p>

                </div>

            </div>

        </div>

    </div>

    <div class="footer">
        Developed By Kone Soft Tech © 2026
    </div>

</div>

<script>

async function loadPage(page){

    const res =
    await fetch(
        "pages/" +
        page +
        ".html"
    );

    const html =
    await res.text();

    document
    .getElementById(
        "contentArea"
    )
    .innerHTML =
    html;

}

function showDashboard(){

    document
    .getElementById(
        "contentArea"
    )
    .innerHTML =
    `
    <div class="card shadow-sm">
        <div class="card-body">
            <h4>
                Welcome To Harsidhi Ventures ERP
            </h4>
            <p>
                Select Menu From Left Side.
            </p>
        </div>
    </div>
    `;

}

setInterval(()=>{

    document
    .getElementById(
        "clock"
    )
    .innerHTML =
    new Date()
    .toLocaleString();

},1000);

</script>

<script src="js/app.js"></script>

</body>
</html>
