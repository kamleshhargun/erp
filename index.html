<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsidhi Ventures ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            overflow-x: hidden;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #0f172a;
            z-index: 1000;
        }

        .sidebar a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #2563eb;
        }

        .main {
            margin-left: 250px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #fff;
            padding: 15px 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .content {
            flex: 1;
        }

        .footer {
            background: #0f172a;
            color: #fff;
            text-align: center;
            padding: 12px;
        }

        @media (max-width:768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="p-3">
            <button id="connectionStatus" class="btn btn-danger w-100">
                🔴 Disconnected
            </button>
        </div>

        <a href="#" onclick="showDashboard( index )">🏠 Dashboard</a>
        <a href="#" onclick="loadPage('daily-input')">📥 Daily Input</a>
        <a href="#" onclick="loadPage('order-track')">📦 Order Track</a>
        <a href="#" onclick="loadPage('view-data')">📊 View Data</a>

    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="header d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Harsidhi Ventures ERP</h3>
            <div id="clock"></div>
        </div>

        <div class="container-fluid p-4 content">
            <div id="contentArea">

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4>Welcome To Harsidhi Ventures ERP</h4>
                        <p>Select Menu From Left Side.</p>
                    </div>
                </div>

            </div>
        </div>

        <div class="footer">
            Developed By Kone Soft Tech © 2026
        </div>

    </div>

    <script>

        const API_URL = "https://your-api-url.com/api";

        const contentArea = document.getElementById("contentArea");
        const connectionBtn = document.getElementById("connectionStatus");

        async function loadPage(page) {

            try {

                const response = await fetch(`pages/${page}.html`);

                if (!response.ok) {
                    throw new Error("Page not found");
                }

                const html = await response.text();
                contentArea.innerHTML = html;

            } catch (error) {

                contentArea.innerHTML = `
                    <div class="alert alert-danger">
                        Failed to load page.
                    </div>
                `;

                console.error(error);
            }
        }

        function showDashboard() {

            contentArea.innerHTML = `
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4>Welcome To Harsidhi Ventures ERP</h4>
                        <p>Select Menu From Left Side.</p>
                    </div>
                </div>
            `;
        }

        function updateClock() {
            document.getElementById("clock").textContent =
                new Date().toLocaleString();
        }

        setInterval(updateClock, 1000);
        updateClock();

        async function checkConnection() {

            try {

                const response = await fetch(`${API_URL}?action=ping`);
                const data = await response.json();

                if (data.success) {

                    connectionBtn.className = "btn btn-success w-100";
                    connectionBtn.innerHTML = "🟢 Connected";

                } else {
                    throw new Error();
                }

            } catch (error) {

                connectionBtn.className = "btn btn-danger w-100";
                connectionBtn.innerHTML = "🔴 Disconnected";
            }
        }

        checkConnection();
        setInterval(checkConnection, 30000);

    </script>

</body>

</html>
